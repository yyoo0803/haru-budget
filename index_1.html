<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루예산">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>하루예산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F5F6F8; --card:#FFFFFF; --soft:#F1F2F5; --line:#E9EBEF;
  --ink:#111418; --ink2:#5B616E; --ink3:#9AA0AB;
  --primary:#111418; --on-primary:#FFFFFF; --accent:#3D63F5; --accent-soft:#E8EDFF;
  --good:#12A36D; --good-soft:#E3F6EE; --warn:#C27A00; --warn-soft:#FFF3DC; --bad:#E03E52; --bad-soft:#FDE7EA;
  --shadow:0 1px 2px rgba(17,20,24,.04),0 8px 24px rgba(17,20,24,.05);
  --font:"Outfit","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E0F12; --card:#17191D; --soft:#1F2227; --line:#25282E;
  --ink:#F2F3F5; --ink2:#A7ADB8; --ink3:#6E7582;
  --primary:#F2F3F5; --on-primary:#0E0F12; --accent:#7C95FF; --accent-soft:#1E2544;
  --good:#3DD39A; --good-soft:#12332A; --warn:#F2B33D; --warn-soft:#352B14; --bad:#FF6F84; --bad-soft:#3A1C23;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E0F12; --card:#17191D; --soft:#1F2227; --line:#25282E;
  --ink:#F2F3F5; --ink2:#A7ADB8; --ink3:#6E7582;
  --primary:#F2F3F5; --on-primary:#0E0F12; --accent:#7C95FF; --accent-soft:#1E2544;
  --good:#3DD39A; --good-soft:#12332A; --warn:#F2B33D; --warn-soft:#352B14; --bad:#FF6F84; --bad-soft:#3A1C23;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:20px;padding-block:calc(env(safe-area-inset-top,0px) + 8px) calc(110px + env(safe-area-inset-bottom,0px));min-height:100%;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto}
.screen{display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.head{display:flex;align-items:center;gap:8px;padding-block:14px 4px}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0;flex:1}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.ibtn.dark{background:var(--primary);color:var(--on-primary)}
.eyebrow{font-size:13px;color:var(--ink3);font-weight:600}
/* cards */
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.card.flat{padding:16px 18px}
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.sec h2{font-size:16px;margin:0;font-weight:700;letter-spacing:-.2px}
.aside{font-size:12px;color:var(--ink3)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--ink2)}
.banner button{border:0;background:var(--soft);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:12px;font-weight:700;white-space:nowrap}
/* summary */
.total .big{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.total .big small{font-size:18px;font-weight:700;margin-left:2px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpis div{background:var(--soft);border-radius:14px;padding:10px 12px}
.kpis b{display:block;font-size:15px;font-weight:700}
.kpis span{font-size:11px;color:var(--ink3);font-weight:600}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.bar.thick{height:10px;margin-top:14px}
/* seg */
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 10px;font-size:13px;color:var(--ink3);font-weight:700;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg .ic{width:16px;height:16px}
.seg.inline{display:inline-flex}
.seg.inline button{flex:none}
/* goal cards */
.gchip{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none}
.gchip .ic{width:22px;height:22px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{border:0;text-align:left;background:var(--card);border-radius:22px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-height:178px;justify-content:space-between;width:100%}
.gcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.gcard .name{font-weight:700;font-size:15px;line-height:1.35;letter-spacing:-.2px}
.gcard .pct{font-size:28px;font-weight:800;letter-spacing:-.8px;line-height:1}
.gcard .meta{font-size:12px;color:var(--ink3);margin-top:4px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.gadd{border:1.5px dashed var(--line);background:none;border-radius:22px;min-height:178px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--ink3);font-weight:700;font-size:14px}
.glist{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:14px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.grow:last-child{border-bottom:0}
.grow .gchip{grid-row:span 2}
.grow .n{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.grow .a{font-size:13px;font-weight:700;text-align:right}
.grow .bar{grid-column:2/-1}
/* detail */
.dhead{display:flex;align-items:center;gap:12px}
.dhead .t{flex:1;min-width:0}
.dhead .t b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>button{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 0}
.item .n{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0;flex-wrap:wrap}
.item .a{font-size:13px;font-weight:600;color:var(--ink2);text-align:right}
.item .bar{grid-column:1/-1}
.item .chev{color:var(--ink3);transition:transform .2s;width:18px;height:18px}
.item.open .chev{transform:rotate(90deg)}
.item .sub{padding:0 0 14px;display:flex;flex-direction:column;gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--bad-soft);color:var(--bad)}
/* tx rows */
.txday{font-size:12px;color:var(--ink3);font-weight:600;display:flex;justify-content:space-between;padding:14px 0 4px}
.txday:first-child{padding-top:0}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;background:none;width:100%;text-align:left}
.tx .ti{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.tx .ti .ic{width:18px;height:18px}
.tx .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .a{font-weight:700}
.empty{color:var(--ink3);font-size:14px;text-align:center;padding:26px 0}
/* charts */
.pie{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center}
.pie svg{max-width:100%;height:auto;overflow:visible}
.pie path{cursor:pointer;transition:opacity .15s}
.pie path:focus-visible{outline:none;stroke:var(--ink)}
.pc1{font-size:12px;fill:var(--ink3);font-family:var(--font);font-weight:600}
.pc2{font-size:20px;fill:var(--ink);font-weight:800;font-family:var(--font)}
.pc3{font-size:11px;fill:var(--ink3);font-family:var(--font)}
.lgs{display:flex;flex-direction:column;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:auto 1fr auto 44px;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:6px 8px;border-radius:10px;width:100%}
.lg:hover,.lg.on{background:var(--soft)}
.lg.dim{opacity:.45}
.lgn{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgv{font-size:12px;color:var(--ink3);text-align:right}
.lgp{font-size:13px;font-weight:700;text-align:right}
.vbar{width:100%;height:auto;display:block;overflow:visible}
.vbar text{font-family:var(--font);fill:var(--ink3);font-size:10px}
.vbar .grid{stroke:var(--line);stroke-width:1}
.vbar rect.hit{fill:transparent;cursor:pointer}
.hbars{display:flex;flex-direction:column;gap:14px}
.hb{display:grid;grid-template-columns:1fr auto;gap:6px 8px;border:0;background:none;text-align:left;padding:0;width:100%}
.hb .n{font-weight:600;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.hb .v{font-size:12px;color:var(--ink2);font-weight:600}
.hb .bar{grid-column:1/-1;height:8px}
.readout{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.readout b{font-size:22px;font-weight:800;letter-spacing:-.5px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;flex:none;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip .ic{width:15px;height:15px}
.wrapchips{flex-wrap:wrap;overflow:visible}
.mnav{display:flex;align-items:center;gap:2px}
.mnav button{border:0;background:var(--soft);width:30px;height:30px;border-radius:50%;color:var(--ink2);font-size:16px;line-height:1}
.mnav span{font-weight:700;font-size:14px;min-width:84px;text-align:center}
/* buttons */
.btn{border:0;background:var(--soft);border-radius:14px;padding:11px 16px;font-size:14px;font-weight:700;color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.danger{background:none;color:var(--bad);padding-inline:6px}
.btn.wide{width:100%;padding:15px;font-size:15px}
.btnrow{display:flex;gap:8px;align-items:center}
.sticky{position:sticky;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:4}
.sticky .btn{box-shadow:0 8px 20px rgba(0,0,0,.15)}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 40px);max-width:300px;background:var(--card);border-radius:22px;box-shadow:0 8px 30px rgba(17,20,24,.12);border:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:6px;gap:6px;z-index:10}
.nav button{border:0;background:none;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700;color:var(--ink3);padding:11px 0}
.nav button[aria-current="page"]{background:var(--primary);color:var(--on-primary)}
.nav .ic{width:19px;height:19px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;max-height:94%;overflow:auto}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.shead h3{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
.xbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);display:grid;place-items:center;color:var(--ink2);flex:none}
.xbtn .ic{width:18px;height:18px;stroke-width:2.2}
.field{display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--ink2);font-weight:600}
input[type=text],input[type=date],input[inputmode],textarea{font:inherit;color:var(--ink);background:var(--soft);border:1px solid transparent;border-radius:14px;padding:12px 14px;width:100%;min-width:0;font-size:15px}
input:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--card)}
textarea{resize:vertical;min-height:120px;line-height:1.55}
.amount-wrap{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.amount-wrap .amount-in{font-size:36px;font-weight:800;border:0;background:none;padding:0;border-radius:0;letter-spacing:-1px;font-family:"Outfit",sans-serif}
.amount-wrap .amount-in:focus{background:none}
.amount-wrap span{font-size:18px;color:var(--ink2);font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:0;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick{aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;background:var(--soft);display:grid;place-items:center;color:var(--ink2)}
.pick[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.cpick{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 2px transparent}
.cpick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.irow{display:grid;grid-template-columns:1fr 128px auto;gap:6px;align-items:center}
.irow .x{border:0;background:none;width:32px;height:32px;border-radius:10px;color:var(--ink3);font-size:20px}
.totalrow{display:flex;justify-content:space-between;font-size:14px;color:var(--ink)}
.totalrow b{font-weight:800}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--primary);color:var(--on-primary);padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:30;white-space:nowrap}
.status{font-size:11px;color:var(--ink3);text-align:center;margin-top:18px}
@media (max-width:400px){body{padding-inline:16px}.pie{grid-template-columns:1fr;justify-items:center}.lgs{width:100%}.irow{grid-template-columns:1fr 104px auto}.ggrid{gap:10px}.gcard{padding:14px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.7}}.screen{animation:fade .18s ease-out}@keyframes fade{from{opacity:.5}}}
</style>
</head>
<body>
<div class="app"><div id="screen" class="screen"></div><div class="status" id="status"></div></div>
<nav class="nav" id="nav" aria-label="메뉴"></nav>
<div id="sheetSlot"></div>
<div id="toastSlot"></div>

<script>
(function(){
const PALETTE=["#2a78d6","#eb6834","#1baf7a","#eda100","#e87ba4","#008300","#4a3aa7","#e34948"];
const GCOL={sky:"#2a78d6",teal:"#1baf7a",violet:"#6A5AE0",coral:"#e34948",amber:"#eda100",mint:"#16A866",pink:"#e87ba4",orange:"#eb6834",slate:"#7A8791"};
const gc=g=>GCOL[g]||GCOL.sky;
const tint=c=>`background:color-mix(in srgb, ${c} 14%, transparent);color:${c}`;
const P={
 cake:"M4 20h16M5 20v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7M5 15.5c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0M12 11V8M12 5.8c.9-.8.9-1.9 0-2.8-.9.9-.9 2 0 2.8z",
 house:"M3 11l9-7 9 7M5 9.5V20h14V9.5M10 20v-5h4v5",
 plane:"M3 11.5L21 4l-7.5 18-2.5-7.5zM11 14.5L21 4",

 heart:"M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z",
 grad:"M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5",

 wallet:"M3 7h15a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l12-3v3M16 13.5h.01",
 baby:"M12 21a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM9.5 12h.01M14.5 12h.01M10 15.5c1.2.8 2.8.8 4 0M12 5c0-1.5 1-2 2-2",
 paw:"M8 13c-2 2-3 5 0 6 1.5.5 2.5-.5 4-.5s2.5 1 4 .5c3-1 2-4 0-6s-6-2-8 0zM6 9.5a1.5 2 0 1 0 0-.01M10 6.5a1.5 2 0 1 0 0-.01M14 6.5a1.5 2 0 1 0 0-.01M18 9.5a1.5 2 0 1 0 0-.01",
 target:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01",
 pie:"M12 3v9h9A9 9 0 1 1 12 3zM15 3.5A9 9 0 0 1 20.5 9H15z",
 plus:"M12 5v14M5 12h14",
 back:"M15 5l-7 7 7 7",
 grid:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z",
 list:"M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01",
 pen:"M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4",
 clock:"M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2",
 layers:"M12 3l9 5-9 5-9-5zM3 13l9 5 9-5",
 chev:"M9 6l6 6-6 6",
 x:"M6 6l12 12M18 6L6 18",
 more:"M5 12h.01M12 12h.01M19 12h.01"
};
const GOAL_ICONS=["cake","house","ring","plane","car","gift","heart","baby","grad","paw","star","wallet"];
const ic=n=>`<svg viewBox="0 0 24 24" class="ic" aria-hidden="true"><path d="${P[n]||P.star}"/></svg>`;
const WD=["일","월","화","수","목","금","토"];
const won=n=>Math.round(n).toLocaleString("ko-KR");
const short=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?"−":"";if(a>=1e8)return s+(a/1e8).toFixed(1).replace(/\.0$/,"")+"억";if(a>=1e4)return s+Math.round(a/1e4).toLocaleString("ko-KR")+"만";return s+a.toLocaleString("ko-KR")};
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const curMonth=todayKey.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysIn=m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()};
const shiftMonth=(m,d)=>{const[y,mm]=m.split("-").map(Number);const t=new Date(y,mm-1+d,1);return `${t.getFullYear()}-${pad(t.getMonth()+1)}`};
const mLabel=m=>`${m.slice(0,4)}년 ${Number(m.slice(5))}월`;
const moneyVal=v=>Number(String(v).replace(/[^\d]/g,""))||0;
const dday=d=>{if(!d)return "";const x=Math.round((new Date(d+"T00:00")-new Date(todayKey+"T00:00"))/864e5);return x>0?`D-${x}`:x===0?"D-DAY":`D+${-x}`};
const fmtDate=d=>{const t=new Date(d+"T00:00");return `${t.getMonth()+1}월 ${t.getDate()}일 ${WD[t.getDay()]}요일`};

      [[0,"2026-09-01",580000,"왕복 항공 4인"],[1,"2026-09-08",720000,"독채 펜션 3박"],[2,"2026-09-18",210000,"SUV 3일"]])

function init(){

/* ---------- calc ---------- */
function pcalc(p){
  const per={};p.items.forEach(i=>per[i.id]=0);let spent=0;
  p.tx.forEach(t=>{const a=Number(t.amount)||0;spent+=a;if(per[t.itemId]!==undefined)per[t.itemId]+=a});
  const budget=p.items.reduce((s,i)=>s+Number(i.budget||0),0);
  return{budget,spent,left:budget-spent,pct:budget?spent/budget*100:0,per};
}
const itemColor=(p,id)=>PALETTE[Math.max(0,p.items.findIndex(i=>i.id===id))%PALETTE.length];
function statusPill(s,b){if(!b)return "";if(s>b)return `<span class="pill over">${short(s-b)}원 초과</span>`;if(s===b)return `<span class="pill ok">완료</span>`;if(s/b>=.9)return `<span class="pill warn">거의 다 씀</span>`;return ""}

/* ---------- charts ---------- */
function arcPath(cx,cy,r,ri,a0,a1){
  const p=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)];if(a1-a0>=Math.PI*2-1e-6)a1=a0+Math.PI*2-1e-4;
  const L=a1-a0>Math.PI?1:0;const[x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
  return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${L} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${ri},${ri} 0 ${L} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`;
}
function donut(ns,rows,label){
  rows=rows.filter(r=>r.v>0);const total=rows.reduce((s,r)=>s+r.v,0);
  if(!total)return `<div class="empty">이 기간에 기록한 지출이 없어요</div>`;
  const sel=rows.find(r=>r.id===ui.sel[ns])?ui.sel[ns]:null;let a=0;const C=90,R=80,RI=56;
  const slices=rows.map(r=>{const a0=a,a1=a+r.v/total*Math.PI*2;a=a1;const on=sel===r.id;const pc=(r.v/total*100).toFixed(1);
    return `<path d="${arcPath(C,C,on?R+4:R,RI,a0,a1)}" fill="${r.color}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" opacity="${sel&&!on?0.28:1}" data-a="sel" data-ns="${ns}" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)} ${won(r.v)}원 ${pc}%"><title>${esc(r.name)} ${won(r.v)}원 (${pc}%)</title></path>`}).join("");
  const sr=sel&&rows.find(r=>r.id===sel);
  const center=sr?`<text x="${C}" y="${C-8}" text-anchor="middle" class="pc1">${esc(sr.name.length>7?sr.name.slice(0,7)+"…":sr.name)}</text><text x="${C}" y="${C+15}" text-anchor="middle" class="pc2">${(sr.v/total*100).toFixed(1)}%</text><text x="${C}" y="${C+31}" text-anchor="middle" class="pc3">${short(sr.v)}원</text>`
    :`<text x="${C}" y="${C-6}" text-anchor="middle" class="pc1">${label}</text><text x="${C}" y="${C+17}" text-anchor="middle" class="pc2">${short(total)}</text><text x="${C}" y="${C+33}" text-anchor="middle" class="pc3">원</text>`;
  const legend=[...rows].sort((x,y)=>y.v-x.v).map(r=>{const on=sel===r.id;return `<button class="lg${on?" on":""}${sel&&!on?" dim":""}" data-a="sel" data-ns="${ns}" data-id="${r.id}"><span class="dot" style="background:${r.color}"></span><span class="lgn">${esc(r.name)}</span><span class="lgv num">${short(r.v)}원</span><span class="lgp num">${(r.v/total*100).toFixed(1)}%</span></button>`}).join("");
  return `<div class="pie"><svg viewBox="0 0 180 180" width="160" height="160" role="img" aria-label="${label} 비율">${slices}${center}</svg><div class="lgs">${legend}</div></div>`;
}
function niceStep(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
/* bars: [{key,label,v}] */
function vbars(ns,bars,labelEvery){
  const W=340,H=170,L=38,B=22,T=10,Rr=4;const pw=W-L-4,ph=H-B-T;
  const vmax=Math.max(...bars.map(b=>b.v),0);const step=niceStep(Math.max(vmax,1)/3);const nt=Math.max(1,Math.ceil(vmax/step));const mx=step*nt;const sel=ui.sel[ns];const si=bars.findIndex(b=>b.key===sel);
  const slot=pw/bars.length;const bw=Math.max(3,Math.min(26,slot*.62));
  let g="";for(let i=0;i<=nt;i++){const y=T+ph-ph*i/nt;g+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${i?short(step*i):"0"}</text>`}
  const bs=bars.map((b,i)=>{const x=L+slot*i+(slot-bw)/2;const h=b.v?Math.max(2,b.v/mx*ph):0;const y=T+ph-h;const on=sel===b.key;const r=Math.min(Rr,bw/2,h);
    const path=h?`<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${y+h}Z" fill="var(--accent)" opacity="${sel&&!on?0.3:1}"/>`:"";
    const near=si>-1&&!on&&Math.abs(i-si)*slot<22;const lab=((i%labelEvery===0&&!near)||on)?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" style="${on?"fill:var(--ink);font-weight:700":""}">${b.label}</text>`:"";
    return `${path}${lab}<rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph+B}" data-a="sel" data-ns="${ns}" data-id="${b.key}" tabindex="0" role="button" aria-label="${b.aria||b.label} ${won(b.v)}원"><title>${b.aria||b.label} ${won(b.v)}원</title></rect>`}).join("");
  return `<svg class="vbar" viewBox="0 0 ${W} ${H}" role="img" aria-label="기간별 지출 막대 그래프">${g}${bs}</svg>`;
}

/* ---------- rows ---------- */
function txRow(p,t,showGoal){const it=p.items.find(i=>i.id===t.itemId);const c=showGoal?gc(p.grad):itemColor(p,t.itemId);
  return `<button class="tx" data-a="tx-edit" data-pid="${p.id}" data-id="${t.id}"><span class="ti" style="${tint(c)}">${showGoal?ic(p.icon):`<span class="dot" style="background:${c};width:10px;height:10px"></span>`}</span><div style="min-width:0"><div class="t1">${esc((t.memo||"").split("\n")[0]||it?.name||"지출")}</div><div class="t2">${esc(showGoal?`${p.name} · ${it?.name||"항목 없음"}`:(it?.name||"항목 없음"))}</div></div><div class="a num">−${won(t.amount)}</div></button>`}
function groupByDate(list,rowFn){const g={};list.forEach(t=>(g[t.t.date]=g[t.t.date]||[]).push(t));
  return Object.keys(g).sort().reverse().map(d=>`<div class="txday"><span>${fmtDate(d)}${d===todayKey?" · 오늘":""}</span><span class="num">−${won(g[d].reduce((s,x)=>s+Number(x.t.amount),0))}원</span></div>`+g[d].map(rowFn).join("")).join("")}

/* ---------- screens ---------- */
function render(){
  const it=(t,icn,l)=>`<button data-a="tab" data-t="${t}" ${ui.tab===t?'aria-current="page"':""}>${ic(icn)}${l}</button>`;
  document.getElementById("nav").innerHTML=it("goals","target","목표 예산")+it("stats","pie","통계");
  const s=document.getElementById("screen");
  if(ui.tab==="goals"&&ui.proj&&state.projects.find(p=>p.id===ui.proj))s.innerHTML=scrProject();
  else{if(ui.tab==="goals")ui.proj=null;s.innerHTML=ui.tab==="stats"?scrStats():scrGoals()}
}
function scrGoals(){
  const ps=state.projects;const all=ps.map(pcalc);const B=all.reduce((s,c)=>s+c.budget,0),S=all.reduce((s,c)=>s+c.spent,0);

  else if(v==="card")body=`<div class="ggrid">${ps.map(p=>{const c=pcalc(p);const col=gc(p.grad);return `<button class="gcard" data-a="open-proj" data-id="${p.id}">
      <div class="top"><span class="gchip" style="${tint(col)}">${ic(p.icon)}</span>${p.example?'<span class="tag ex">예시</span>':p.date?`<span class="tag">${dday(p.date)}</span>`:""}</div>
      <div><div class="name">${esc(p.name)}</div><div class="meta num">${short(c.spent)} / ${short(c.budget)}원</div></div>
      <div><div class="pct num" style="margin-bottom:8px">${Math.round(c.pct)}<span style="font-size:15px">%</span></div><div class="bar"><i style="width:${Math.min(100,c.pct)}%;background:${c.spent>c.budget?"var(--bad)":col}"></i></div></div></button>`}).join("")}
      <button class="gadd" data-a="new-proj">${ic("plus")}새 목표</button></div>`;
  else body=`<section class="card flat"><div class="glist">${ps.map(p=>{const c=pcalc(p);const col=gc(p.grad);return `<button class="grow" data-a="open-proj" data-id="${p.id}"><span class="gchip" style="${tint(col)}">${ic(p.icon)}</span>
      <span class="n">${esc(p.name)}${p.date?`<span class="tag">${dday(p.date)}</span>`:""}</span><span class="a num">${Math.round(c.pct)}%</span>
      <span class="bar"><i style="width:${Math.min(100,c.pct)}%;background:${c.spent>c.budget?"var(--bad)":col}"></i></span></button>`}).join("")}</div></section>`;
  return `<header class="head"><h1>목표 예산</h1><button class="ibtn" data-a="backup" aria-label="백업·설정">${ic("more")}</button><button class="ibtn dark" data-a="new-proj" aria-label="새 목표">${ic("plus")}</button></header>
  ${ps.some(p=>p.example)?`<div class="banner"><span>예시 목표가 들어 있어요</span><button data-a="clear-exp">예시 지우기</button></div>`:backupNudge()}
  ${ps.length?`<section class="card total"><div class="eyebrow">남은 예산</div><div class="big num">${B-S<0?"−":""}${won(Math.abs(B-S))}<small>원</small></div>
    <div class="bar thick"><i style="width:${B?Math.min(100,S/B*100):0}%;background:var(--accent)"></i></div>
    <div class="kpis num"><div><b>${short(B)}</b><span>총 예산</span></div><div><b>${short(S)}</b><span>사용</span></div><div><b>${ps.length}개</b><span>목표</span></div></div></section>
    <div style="display:flex;justify-content:space-between;align-items:center"><span class="eyebrow">내 목표</span><div class="seg inline">${[["card","grid","카드"],["list","list","목록"]].map(([k,i,l])=>`<button data-a="gview" data-v="${k}" aria-pressed="${v===k}">${ic(i)}${l}</button>`).join("")}</div></div>`:""}
  ${body}`;
}
function scrProject(){
  const p=state.projects.find(x=>x.id===ui.proj);const c=pcalc(p);const v=ui.pview;const col=gc(p.grad);
  let body;
  if(v==="items")body=`<section class="card flat">${p.items.map((it,i)=>{const s=c.per[it.id]||0;const b=Number(it.budget||0);const open=ui.openItem===it.id;const ic2=PALETTE[i%PALETTE.length];

      <span class="bar"><i style="width:${b?Math.min(100,s/b*100):0}%;background:${s>b?"var(--bad)":ic2}"></i></span></button>

function allTx(){return state.projects.filter(p=>ui.statGoal==="all"||p.id===ui.statGoal).flatMap(p=>p.tx.map(t=>({p,t})))}
function breakdownRows(list){
  if(ui.statGoal==="all"){const m={};state.projects.forEach(p=>m[p.id]={id:p.id,name:p.name,color:gc(p.grad),v:0});list.forEach(x=>{if(m[x.p.id])m[x.p.id].v+=Number(x.t.amount)});return Object.values(m)}
  const p=state.projects.find(x=>x.id===ui.statGoal);if(!p)return[];const m={};p.items.forEach((it,i)=>m[it.id]={id:it.id,name:it.name,color:PALETTE[i%PALETTE.length],v:0});list.forEach(x=>{if(m[x.t.itemId])m[x.t.itemId].v+=Number(x.t.amount)});return Object.values(m)}
function scrStats(){
  const ps=state.projects;
  if(ui.statGoal!=="all"&&!ps.find(p=>p.id===ui.statGoal))ui.statGoal="all";
  const list=allTx();const st=ui.stat;const unit=ui.statGoal==="all"?"목표":"항목";
  const seg=`<div class="seg">${[["all","통합"],["month","월별"],["day","일별"]].map(([k,l])=>`<button data-a="stat" data-v="${k}" aria-pressed="${st===k}">${l}</button>`).join("")}</div>`;
  const chips=ps.length>1?`<div class="chips"><button class="chip" data-a="stat-goal" data-id="all" aria-pressed="${ui.statGoal==="all"}">모든 목표</button>${ps.map(p=>`<button class="chip" data-a="stat-goal" data-id="${p.id}" aria-pressed="${ui.statGoal===p.id}">${ic(p.icon)}${esc(p.name)}</button>`).join("")}</div>`:"";
  let body="";
  if(st==="all"){
    const sel=ui.statGoal==="all"?ps:[ps.find(p=>p.id===ui.statGoal)];const cs=sel.map(pcalc);const B=cs.reduce((s,c)=>s+c.budget,0),S=list.reduce((s,x)=>s+Number(x.t.amount),0);
    const bars=ui.statGoal==="all"?ps.map(p=>{const c=pcalc(p);return{name:p.name,color:gc(p.grad),s:c.spent,b:c.budget}}):(()=>{const p=sel[0];const c=pcalc(p);return p.items.map((it,i)=>({name:it.name,color:PALETTE[i%PALETTE.length],s:c.per[it.id]||0,b:Number(it.budget||0)}))})();
    body=`<section class="card total"><div class="eyebrow">전체 기간 사용</div><div class="big num">${won(S)}<small>원</small></div>
      <div class="kpis num"><div><b>${short(B)}</b><span>총 예산</span></div><div><b>${B?Math.round(S/B*100):0}%</b><span>사용률</span></div><div><b>${short(B-S)}</b><span>남은 금액</span></div></div></section>
      <section class="card"><div class="sec"><h2>${unit}별 사용 비율</h2></div>${donut("s_all",breakdownRows(list),"총 사용")}</section>
      <section class="card"><div class="sec"><h2>예산 대비 사용</h2></div><div class="hbars">${bars.map(r=>`<div class="hb"><span class="n"><span class="dot" style="background:${r.color}"></span>${esc(r.name)}</span><span class="v num">${short(r.s)} / ${short(r.b)}원</span><span class="bar"><i style="width:${r.b?Math.min(100,r.s/r.b*100):0}%;background:${r.s>r.b?"var(--bad)":r.color}"></i></span></div>`).join("")||'<div class="empty">목표가 없어요</div>'}</div></section>`;
  }else if(st==="month"){
    const months=list.map(x=>x.t.date.slice(0,7));let lo=months.length?months.reduce((a,b)=>a<b?a:b):curMonth,hi=months.length?months.reduce((a,b)=>a>b?a:b):curMonth;if(curMonth>hi)hi=curMonth;
    const keys=[];for(let m=hi;keys.length<12;m=shiftMonth(m,-1)){keys.unshift(m);if(m<=lo&&keys.length>=6)break}
    const sums={};list.forEach(x=>{const m=x.t.date.slice(0,7);sums[m]=(sums[m]||0)+Number(x.t.amount)});
    if(!ui.sel.s_m||!keys.includes(ui.sel.s_m))ui.sel.s_m=[...keys].reverse().find(k=>sums[k])||hi;
    const selM=ui.sel.s_m;const inM=list.filter(x=>x.t.date.startsWith(selM));const tot=inM.reduce((s,x)=>s+Number(x.t.amount),0);
    const avg=keys.reduce((s,k)=>s+(sums[k]||0),0)/keys.length;
    body=`<section class="card"><div class="readout"><div><div class="eyebrow">${mLabel(selM)}</div><b class="num">${won(tot)}원</b></div><span class="aside num">월평균 ${short(avg)}원</span></div>
      ${vbars("s_m",keys.map(k=>({key:k,label:Number(k.slice(5))+"월",aria:mLabel(k),v:sums[k]||0})),keys.length>8?2:1)}
      <div class="aside" style="margin-top:6px">막대를 누르면 그 달을 자세히 볼 수 있어요</div></section>
      <section class="card"><div class="sec"><h2>${Number(selM.slice(5))}월 ${unit}별</h2></div>${donut("s_md",breakdownRows(inM),"월 사용")}</section>
      <section class="card flat"><div class="sec" style="margin-bottom:6px"><h2>${Number(selM.slice(5))}월 내역</h2><span class="aside">${inM.length}건</span></div>${inM.length?groupByDate(inM,x=>txRow(x.p,x.t,true)):'<div class="empty">이 달에 기록한 지출이 없어요</div>'}</section>`;
  }else{
    if(!ui.statMonth){const ms=list.map(x=>x.t.date.slice(0,7));ui.statMonth=ms.includes(curMonth)||!ms.length?curMonth:ms.reduce((a,b)=>a>b?a:b)}
    const m=ui.statMonth;const n=daysIn(m);const sums={};list.forEach(x=>{if(x.t.date.startsWith(m)){const d=Number(x.t.date.slice(8));sums[d]=(sums[d]||0)+Number(x.t.amount)}});
    const mt=Object.values(sums).reduce((a,b)=>a+b,0);const sd=ui.sel.s_d&&ui.sel.s_d.startsWith(m)?ui.sel.s_d:null;
    const dayList=sd?list.filter(x=>x.t.date===sd):list.filter(x=>x.t.date.startsWith(m));
    body=`<section class="card"><div class="sec"><div class="mnav"><button data-a="sm-prev" aria-label="이전 달">‹</button><span class="num">${mLabel(m)}</span><button data-a="sm-next" aria-label="다음 달">›</button></div><span class="aside num">${Object.keys(sums).length}일 지출</span></div>
      <div class="readout"><div><div class="eyebrow">${sd?fmtDate(sd):"이 달 합계"}</div><b class="num">${won(sd?(sums[Number(sd.slice(8))]||0):mt)}원</b></div>${sd?`<button class="btn" style="padding:6px 12px;font-size:12px" data-a="sel" data-ns="s_d" data-id="${sd}">전체 보기</button>`:""}</div>
      ${vbars("s_d",Array.from({length:n},(_,i)=>({key:`${m}-${pad(i+1)}`,label:String(i+1),aria:fmtDate(`${m}-${pad(i+1)}`),v:sums[i+1]||0})),5)}
      <div class="aside" style="margin-top:6px">막대를 누르면 그날 내역을 볼 수 있어요</div></section>
      <section class="card flat"><div class="sec" style="margin-bottom:6px"><h2>${sd?`${Number(sd.slice(5,7))}월 ${Number(sd.slice(8))}일 내역`:"이 달 내역"}</h2><span class="aside">${dayList.length}건</span></div>${dayList.length?groupByDate(dayList,x=>txRow(x.p,x.t,true)):'<div class="empty">기록한 지출이 없어요</div>'}</section>`;
  }
  return `<header class="head"><h1>통계</h1></header>${seg}${chips}${body}`;
}
function backupNudge(){
  let lb=null;try{lb=localStorage.getItem("hr_lastbackup")}catch(e){}
  const days=lb?Math.round((new Date(todayKey)-new Date(lb))/864e5):null;if(lb&&days<14)return "";
  if(!state.projects.some(p=>p.tx.length))return "";
  return `<div class="banner"><span>${lb?`마지막 백업이 ${days}일 전이에요`:"기록은 이 기기에만 저장돼요"}</span><button data-a="backup">백업하기</button></div>`;
}

/* ---------- sheets ---------- */
let sheet=null;
const xbtn=`<button type="button" class="xbtn" data-a="s-close" aria-label="닫기">${ic("x")}</button>`;
function openTx(o){
  if(o&&o.edit)sheet={kind:"tx",...o,confirm:false};
  else{const p=(o&&o.pid&&state.projects.find(x=>x.id===o.pid))||state.projects[0];if(!p){toast("먼저 목표를 만들어 주세요");return}
    sheet={kind:"tx",id:uid(),pid:p.id,item:(o&&o.item)||p.items[0]?.id||"",amount:0,memo:"",date:todayKey,edit:false,confirm:false,fixed:!!(o&&o.pid)}}
  drawSheet();setTimeout(()=>document.getElementById("s_amt")?.focus(),80);
}
function openProj(p){
  sheet=p?{kind:"proj",id:p.id,name:p.name,icon:p.icon,grad:p.grad,date:p.date||"",items:p.items.map(i=>({...i})),isNew:false,confirm:false}
    :{kind:"proj",id:"p_"+uid(),name:"",icon:"cake",grad:"coral",date:"",items:[{id:"i_"+uid(),name:"",budget:0}],isNew:true,confirm:false};
  drawSheet();if(!p)setTimeout(()=>document.getElementById("pj_name")?.focus(),80);
}
function drawSheet(){
  const slot=document.getElementById("sheetSlot");const s=sheet;if(!s){slot.innerHTML="";document.body.style.overflow="";return}

    <div style="display:flex;flex-direction:column;gap:8px"><button class="btn primary wide" data-a="bk-export">백업 파일 저장하기</button><div class="aside" style="text-align:center">${lb?`마지막 백업 · ${fmtDate(lb)}`:"아직 백업한 적이 없어요"}</div></div>
    <label class="btn wide" style="text-align:center;cursor:pointer">백업 불러오기<input type="file" id="bk_file" accept=".json,application/json" hidden></label>
    ${s.confirm?`<div class="confirm"><span>모든 목표와 기록을 지울까요?</span><span class="btnrow"><button class="btn" data-a="bk-resetno">취소</button><button class="btn primary" data-a="bk-resetyes">모두 지우기</button></span></div>`:`<button class="btn danger" data-a="bk-reset" style="align-self:center">모든 기록 지우기</button>`}
    </div></div>`;return;
  }

    const p=state.projects.find(x=>x.id===s.pid);
    const goalPick=s.fixed&&!s.edit?"":`<div class="field">목표<div class="chips">${state.projects.map(x=>`<button type="button" class="chip" data-a="s-proj" data-id="${x.id}" aria-pressed="${s.pid===x.id}">${ic(x.icon)}${esc(x.name)}</button>`).join("")}</div></div>`;
    slot.innerHTML=`<div class="scrim" data-a="s-close"><form class="sheet" id="sheetForm" role="dialog" aria-label="지출 기록">
    <div class="shead"><div><div class="aside">${esc(p?.name||"")}</div><h3>${s.edit?"지출 수정":"지출 기록"}</h3></div>${xbtn}</div>
    <div style="display:flex;flex-direction:column;gap:10px"><label class="amount-wrap"><input class="amount-in num" id="s_amt" inputmode="numeric" data-money placeholder="0" value="${s.amount?won(s.amount):""}" aria-label="금액"><span>원</span></label>
    <div class="quick">${[["10000","+1만"],["50000","+5만"],["100000","+10만"],["1000000","+100만"],["0","지우기"]].map(([v,l])=>`<button type="button" data-a="s-q" data-v="${v}">${l}</button>`).join("")}</div></div>
    ${goalPick}
    <div class="field">세부 항목<div class="chips wrapchips">${(p?.items||[]).map((it,i)=>`<button type="button" class="chip" data-a="s-item" data-id="${it.id}" aria-pressed="${s.item===it.id}"><span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span>${esc(it.name)}</button>`).join("")||'<span class="aside">이 목표에 항목이 없어요</span>'}</div></div>
    <label class="field">날짜<input type="date" id="s_date" value="${s.date}"></label>
    <label class="field">메모<textarea id="s_memo" rows="5" placeholder="예: 스냅 예약금, 계좌이체, 잔금은 행사 당일">${esc(s.memo)}</textarea></label>
    ${s.confirm?`<div class="confirm"><span>이 지출을 삭제할까요?</span><span class="btnrow"><button type="button" class="btn" data-a="s-delno">취소</button><button type="button" class="btn primary" data-a="s-delyes">삭제</button></span></div>`:""}
    <div class="btnrow">${s.edit?`<button type="button" class="btn danger" data-a="s-del">삭제</button>`:""}<button type="submit" class="btn primary wide">${s.edit?"저장":"기록하기"}</button></div></form></div>`;
  }else{
    const total=s.items.reduce((a,i)=>a+Number(i.budget||0),0);
    slot.innerHTML=`<div class="scrim" data-a="s-close"><form class="sheet" id="projForm" role="dialog" aria-label="목표 편집">
    <div class="shead"><h3>${s.isNew?"새 목표":"목표 편집"}</h3>${xbtn}</div>
    <label class="field">이름<input type="text" id="pj_name" value="${esc(s.name)}" placeholder="예: 돌잔치, 내 집 마련, 결혼 준비"></label>
    <div class="field">아이콘<div class="pickgrid">${GOAL_ICONS.map(n=>`<button type="button" class="pick" data-a="pj-icon" data-v="${n}" aria-pressed="${s.icon===n}" aria-label="${n}">${ic(n)}</button>`).join("")}</div></div>
    <div class="field">색상<div class="pickgrid" style="grid-template-columns:repeat(9,1fr)">${Object.keys(GCOL).map(g=>`<button type="button" class="cpick" style="background:${GCOL[g]}" data-a="pj-grad" data-v="${g}" aria-pressed="${s.grad===g}" aria-label="${g}"></button>`).join("")}</div></div>
    <label class="field">목표 날짜 (선택)<input type="date" id="pj_date" value="${s.date}"></label>
    <div class="field">세부 항목과 예산
      <div style="display:flex;flex-direction:column;gap:6px">${s.items.map((it,i)=>`<div class="irow"><input type="text" id="pi_n_${i}" value="${esc(it.name)}" placeholder="항목 이름"><input inputmode="numeric" class="num" id="pi_b_${i}" data-money value="${it.budget?won(it.budget):""}" placeholder="예산" style="text-align:right"><button type="button" class="x" data-a="pj-rm" data-idx="${i}" aria-label="항목 삭제">×</button></div>`).join("")}</div>
      <button type="button" class="btn" data-a="pj-add" style="align-self:flex-start;padding:8px 14px;font-size:13px">+ 항목 추가</button>
      <div class="totalrow"><span>목표 예산 합계</span><b class="num" id="pj_total">${won(total)}원</b></div></div>
    ${s.confirm?`<div class="confirm"><span>'${esc(s.name)}' 목표와 모든 기록을 지울까요?</span><span class="btnrow"><button type="button" class="btn" data-a="pj-delno">취소</button><button type="button" class="btn primary" data-a="pj-delyes">삭제</button></span></div>`:""}
    <div class="btnrow">${s.isNew?"":`<button type="button" class="btn danger" data-a="pj-del">삭제</button>`}<button type="submit" class="btn primary wide">${s.isNew?"만들기":"저장"}</button></div></form></div>`;
  }
}
function readTx(){const a=document.getElementById("s_amt");if(!a)return;sheet.amount=moneyVal(a.value);sheet.memo=document.getElementById("s_memo").value;sheet.date=document.getElementById("s_date").value||sheet.date}
function readProj(){const n=document.getElementById("pj_name");if(!n)return;sheet.name=n.value;sheet.date=document.getElementById("pj_date").value;
  sheet.items.forEach((it,i)=>{it.name=document.getElementById("pi_n_"+i).value;it.budget=moneyVal(document.getElementById("pi_b_"+i).value)})}
function removeTx(id){for(const p of state.projects){const i=p.tx.findIndex(t=>t.id===id);if(i>-1)p.tx.splice(i,1)}}
function commitTx(){
  readTx();const s=sheet;if(!s.amount)return toast("금액을 입력해 주세요");
  const p=state.projects.find(x=>x.id===s.pid);if(!p)return toast("목표를 골라 주세요");if(!s.item)return toast("세부 항목을 골라 주세요");
  removeTx(s.id);p.tx.push({id:s.id,itemId:s.item,date:s.date,amount:s.amount,memo:s.memo.trim()});persist();
  const msg=s.edit?"수정했어요":`${won(s.amount)}원 기록했어요`;sheet=null;drawSheet();render();toast(msg);
}
function commitProj(){
  readProj();const s=sheet;const name=s.name.trim();if(!name)return toast("목표 이름을 입력해 주세요");
  const items=s.items.filter(i=>i.name.trim()||i.budget).map(i=>({id:i.id,name:i.name.trim()||"이름 없는 항목",budget:i.budget}));
  let p=state.projects.find(x=>x.id===s.id);
  if(p){Object.assign(p,{name,icon:s.icon,grad:s.grad,date:s.date,items});const ids=new Set(items.map(i=>i.id));p.tx.forEach(t=>{if(!ids.has(t.itemId)&&items[0])t.itemId=items[0].id})}
  else{p={id:s.id,name,icon:s.icon,grad:s.grad,date:s.date,items,tx:[]};state.projects.push(p)}
  persist();const isNew=s.isNew;sheet=null;drawSheet();ui.tab="goals";ui.proj=p.id;ui.pview="items";render();window.scrollTo({top:0});toast(isNew?"목표를 만들었어요":"저장했어요");
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:"haru-budget",version:2,exportedAt:new Date().toISOString(),state},null,1)],{type:"application/json"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`하루예산_백업_${todayKey}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{localStorage.setItem("hr_lastbackup",todayKey)}catch(e){}toast("백업 파일을 저장했어요");if(sheet)drawSheet();
}
function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const st=j.state||j;if(!st||!Array.isArray(st.projects))throw 0;
  state={categories:[],months:{},example:false,projects:[],projSeeded:true,...st};persist();sheet=null;drawSheet();ui.proj=null;render();toast("백업을 불러왔어요")}catch(e){toast("하루예산 백업 파일이 아니에요")}};r.readAsText(file)}
function toast(t){const s=document.getElementById("toastSlot");s.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>s.innerHTML="",1800)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,d=el.dataset;
  if(a==="s-close"&&el.classList.contains("scrim")&&e.target!==el)return;
  switch(a){
    case "tab":ui.tab=d.t;ui.proj=null;saveUi();render();window.scrollTo({top:0});break;
    case "gview":ui.gview=d.v;saveUi();render();break;
    case "pview":ui.pview=d.v;saveUi();render();break;
    case "open-proj":ui.tab="goals";ui.proj=d.id;ui.openItem=null;render();window.scrollTo({top:0});break;
    case "back":ui.proj=null;render();window.scrollTo({top:0});break;
    case "item":ui.openItem=ui.openItem===d.id?null:d.id;render();break;
    case "sel":ui.sel[d.ns]=ui.sel[d.ns]===d.id&&d.ns!=="s_m"?null:d.id;render();break;
    case "stat":ui.stat=d.v;saveUi();render();break;
    case "stat-goal":ui.statGoal=d.id;ui.sel={};render();break;
    case "sm-prev":ui.statMonth=shiftMonth(ui.statMonth,-1);ui.sel.s_d=null;render();break;
    case "sm-next":ui.statMonth=shiftMonth(ui.statMonth,1);ui.sel.s_d=null;render();break;
    case "clear-exp":state.projects=state.projects.filter(p=>!p.example);persist();ui.proj=null;render();toast("예시 목표를 지웠어요");break;
    case "add-tx":openTx({pid:d.pid,item:d.item});break;
    case "tx-edit":{const p=state.projects.find(x=>x.id===d.pid);const t=p&&p.tx.find(x=>x.id===d.id);if(t)openTx({edit:true,id:t.id,pid:p.id,item:t.itemId,amount:t.amount,memo:t.memo||"",date:t.date});break}
    case "new-proj":openProj(null);break;
    case "edit-proj":openProj(state.projects.find(x=>x.id===d.id));break;
    case "backup":sheet={kind:"backup",confirm:false};drawSheet();break;
    case "bk-export":exportData();break;
    case "bk-reset":sheet.confirm=true;drawSheet();break;
    case "bk-resetno":sheet.confirm=false;drawSheet();break;
    case "bk-resetyes":state={categories:[],months:{},example:false,projects:[],projSeeded:true};persist();sheet=null;drawSheet();ui.proj=null;ui.tab="goals";render();toast("모두 지웠어요");break;
    case "s-close":sheet=null;drawSheet();break;
    case "s-q":readTx();sheet.amount=d.v==="0"?0:sheet.amount+Number(d.v);drawSheet();break;
    case "s-proj":{readTx();sheet.pid=d.id;const p=state.projects.find(x=>x.id===d.id);sheet.item=p?.items[0]?.id||"";drawSheet();break}
    case "s-item":readTx();sheet.item=d.id;drawSheet();break;
    case "s-del":readTx();sheet.confirm=true;drawSheet();break;
    case "s-delno":sheet.confirm=false;drawSheet();break;
    case "s-delyes":removeTx(sheet.id);persist();sheet=null;drawSheet();render();toast("삭제했어요");break;
    case "pj-icon":readProj();sheet.icon=d.v;drawSheet();break;
    case "pj-grad":readProj();sheet.grad=d.v;drawSheet();break;
    case "pj-add":readProj();sheet.items.push({id:"i_"+uid(),name:"",budget:0});drawSheet();setTimeout(()=>document.getElementById("pi_n_"+(sheet.items.length-1))?.focus(),30);break;
    case "pj-rm":readProj();sheet.items.splice(Number(d.idx),1);drawSheet();break;
    case "pj-del":readProj();sheet.confirm=true;drawSheet();break;
    case "pj-delno":sheet.confirm=false;drawSheet();break;
    case "pj-delyes":{const id=sheet.id;state.projects=state.projects.filter(p=>p.id!==id);persist();sheet=null;drawSheet();ui.proj=null;render();toast("목표를 삭제했어요");break}
  }
});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="sheetForm")commitTx();if(e.target.id==="projForm")commitProj()});
document.addEventListener("input",e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute("data-money")){const n=moneyVal(t.value);t.value=n?won(n):"";if(t.id.startsWith("pi_b_")&&sheet){readProj();const tot=document.getElementById("pj_total");if(tot)tot.textContent=won(sheet.items.reduce((a,i)=>a+Number(i.budget||0),0))+"원"}}});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="bk_file"&&t.files&&t.files[0])importData(t.files[0])});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){sheet=null;drawSheet();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("svg [data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
init();
})();
</script>
</body>
</html>
