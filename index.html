<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루예산">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>하루예산</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  color-scheme:light;
  --bg:#F6F5F1; --cell:#FFFFFF; --cell2:#F1EFEA; --fill:rgba(40,36,30,.07); --fill2:rgba(40,36,30,.14);
  --sep:#E6E2DA; --label:#1E1D1B; --label2:#6F6B64; --label3:#AFAAA1;
  --tint:#1E1D1B; --tint-ink:#FFFFFF; --green:#5E6B5A; --red:#9B3B30; --orange:#9C7A3C;
  --thumb:#FFFFFF; --bar:rgba(246,245,241,.9); --prim:#1E1D1B; --on-prim:#F6F5F1; --line:#E6E2DA;
  --font:-apple-system,BlinkMacSystemFont,"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --disp:"Noto Serif KR","Nanum Myeongjo","AppleMyungjo",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#121211; --cell:#1B1A18; --cell2:#24221F; --fill:rgba(240,236,228,.08); --fill2:rgba(240,236,228,.16);
  --sep:#2C2A26; --label:#EEEBE4; --label2:#A39E95; --label3:#6A665F;
  --tint:#EEEBE4; --tint-ink:#121211; --green:#9AA893; --red:#D0806F; --orange:#C9A86A;
  --thumb:#3A3834; --bar:rgba(18,18,17,.9); --prim:#EEEBE4; --on-prim:#121211; --line:#2C2A26;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --cell:#1B1A18; --cell2:#24221F; --fill:rgba(240,236,228,.08); --fill2:rgba(240,236,228,.16);
  --sep:#2C2A26; --label:#EEEBE4; --label2:#A39E95; --label3:#6A665F;
  --tint:#EEEBE4; --tint-ink:#121211; --green:#9AA893; --red:#D0806F; --orange:#C9A86A;
  --thumb:#3A3834; --bar:rgba(18,18,17,.9); --prim:#EEEBE4; --on-prim:#121211; --line:#2C2A26;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);height:100%}
body{margin:0;background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.3px;padding-inline:20px;padding-block:calc(env(safe-area-inset-top,0px) + 4px) calc(160px + env(safe-area-inset-bottom,0px));min-height:100%;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.app{max-width:500px;margin:0 auto}
.screen{display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* nav bar + large title */
.navbar{display:flex;align-items:center;justify-content:space-between;min-height:48px;padding-top:12px;gap:8px}
.navbar .tb{border:0;background:none;color:var(--tint);font-size:17px;display:flex;align-items:center;gap:2px;padding:8px 0;min-width:44px}
.navbar .tb .ic{width:24px;height:24px;stroke-width:2.2}
.navbar .tb.r{justify-content:flex-end}
.navbar .ttl{font-size:17px;font-weight:600;text-align:center;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navbar .acts{display:flex;gap:4px;margin-left:auto}
.cbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--fill);color:var(--tint);display:grid;place-items:center}
.cbtn .ic{width:19px;height:19px;stroke-width:2.2}
.large{font-family:var(--disp);font-size:32px;font-weight:700;letter-spacing:-.8px;margin:6px 0 14px;line-height:1.2}
.subhead{font-size:15px;color:var(--label2);margin:-6px 0 12px}
/* grouped lists */
.ghead{font-size:13px;color:var(--label2);text-transform:none;padding:24px 4px 10px;display:flex;justify-content:space-between;align-items:flex-end;letter-spacing:-.1px}
.ghead b{font-family:var(--disp);font-size:20px;font-weight:700;color:var(--label);letter-spacing:-.5px}
.group{background:var(--cell);border-radius:18px;overflow:hidden}
.cellr{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;border:0;background:none;width:100%;text-align:left;position:relative;min-height:44px;color:var(--label)}
.cellr+.cellr::before,.cellr+.cellwrap::before,.cellwrap+.cellr::before{content:"";position:absolute;top:0;right:0;left:var(--inset,60px);height:.5px;background:var(--sep)}
.cellr:active{background:var(--fill)}
.sq{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:none}
.sq .ic{width:18px;height:18px;stroke-width:2}
.sq.lg{width:44px;height:44px;border-radius:11px}
.sq.lg .ic{width:25px;height:25px}
.cellr .t1{font-size:16px;font-weight:600;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cellr .t2{font-size:13px;color:var(--label2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cellr .val{font-size:16px;color:var(--label2);text-align:right;white-space:nowrap}
.cellr .val.strong{color:var(--label)}
.cellr .chev{width:14px;height:14px;color:var(--label3);stroke-width:2.6}
.cellr .mini{height:4px;border-radius:9px;background:var(--fill);overflow:hidden;margin-top:7px}
.cellr .mini i{display:block;height:100%;border-radius:9px}
.badge{font-size:12px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--fill);color:var(--label2);white-space:nowrap;margin-left:6px;vertical-align:1px}
.badge.ex{background:rgba(255,149,0,.16);color:var(--orange)}
.badge.ok{background:rgba(52,199,89,.16);color:var(--green)}
.badge.over{background:rgba(255,59,48,.14);color:var(--red)}
.foot{font-size:13px;color:var(--label2);padding:7px 16px 0}
.empty{color:var(--label2);font-size:15px;text-align:center;padding:28px 16px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--cell);border-radius:12px;padding:12px 16px;font-size:15px;color:var(--label2);margin-top:6px}
.banner button{border:0;background:none;color:var(--tint);font-size:15px;font-weight:600;white-space:nowrap;padding:0}
/* 3D emoji tile */
.emo{width:var(--s);height:var(--s);border-radius:calc(var(--s)*.28);background:var(--cell2);display:grid;place-items:center;flex:none}
.emo img{width:72%;height:72%;object-fit:contain;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.idot{width:12px;height:12px;border-radius:50%;flex:none;display:inline-block}
/* square tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;text-align:left;background:var(--cell);border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:1/1;max-width:100%;width:100%;min-width:0;color:var(--label);box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04)}
.tile:active{transform:scale(.97)}
.tile .top{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.tile .pct{font-size:15px;font-weight:700;color:var(--label2);letter-spacing:-.3px}
.tile .nm{font-size:17px;font-weight:700;line-height:1.25;letter-spacing:-.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .am{font-size:13px;color:var(--label2);margin-top:3px}
.tile .st{font-size:12px;margin-top:2px;font-weight:600;display:block}
.tbar{height:5px;border-radius:9px;background:var(--fill);overflow:hidden;margin-top:10px}
.tbar i{display:block;height:100%;border-radius:9px}
.tile.add{background:transparent;border:1.5px dashed var(--fill2);box-shadow:none;align-items:center;justify-content:center;gap:10px;color:var(--label2);font-weight:600;font-size:15px}
.tile.add .plus{width:44px;height:44px;border-radius:50%;background:var(--cell);display:grid;place-items:center;color:var(--label)}
.ring{position:relative;width:52px;height:52px;flex:none}
.ring svg{width:52px;height:52px;transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;letter-spacing:-.3px}
/* summary card */
.card{background:var(--cell);border-radius:22px;padding:20px 18px}
.hero .lbl{font-size:15px;color:var(--label2)}
.hero .big{font-family:var(--disp);font-size:38px;font-weight:700;letter-spacing:-.4px;line-height:1.15;margin-top:2px}
.hero .big small{font-size:24px;font-weight:600;margin-left:2px}
.track{height:8px;border-radius:9px;background:var(--fill);overflow:hidden;margin-top:14px}
.track i{display:block;height:100%;border-radius:9px}
.hero .hint{font-size:15px;color:var(--label2);margin-top:9px}
.hero .hint.over{color:var(--red)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);margin-top:16px;border-top:.5px solid var(--sep);padding-top:14px}
.stats3>div+div{border-left:.5px solid var(--sep);padding-left:12px}
.stats3 span{font-size:13px;color:var(--label2)}
.stats3 b{display:block;font-size:17px;font-weight:600;margin-top:1px}
/* iOS segmented */
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;position:relative}
.seg button{flex:1;border:0;background:none;border-radius:7px;padding:6px 8px;font-size:14px;color:var(--label);font-weight:500;white-space:nowrap;min-height:30px}
.seg button[aria-pressed="true"]{background:var(--thumb);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04)}
.segwrap{padding-block:18px 4px}
.vtoggle{display:flex;gap:2px}
.vtoggle button{border:0;background:none;width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--tint)}
.vtoggle button[aria-pressed="true"]{background:var(--fill)}
.vtoggle .ic{width:19px;height:19px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:12px 0}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--cell);border-radius:99px;padding:7px 14px;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;flex:none;color:var(--label)}
.chip[aria-pressed="true"]{background:var(--prim);color:var(--on-prim)}
.chip .ic{width:16px;height:16px}
/* charts */
.pie{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.pie svg{max-width:100%;height:auto;overflow:visible}
.pie path{cursor:pointer;transition:opacity .15s}
.pc1{font-size:12px;fill:var(--label2);font-family:var(--font)}
.pc2{font-size:21px;fill:var(--label);font-weight:700;font-family:var(--font)}
.pc3{font-size:11px;fill:var(--label2);font-family:var(--font)}
.lgs{display:flex;flex-direction:column;min-width:0}
.lg{display:grid;grid-template-columns:auto 1fr auto 46px;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:7px 6px;border-radius:8px;width:100%;color:var(--label)}
.lg.on{background:var(--fill)}
.lg.dim{opacity:.4}
.lgn{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgv{font-size:13px;color:var(--label2);text-align:right}
.lgp{font-size:15px;font-weight:600;text-align:right}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.vbar{width:100%;height:auto;display:block;overflow:visible;margin-top:8px}
.vbar text{font-family:var(--font);fill:var(--label2);font-size:10px}
.vbar .grid{stroke:var(--sep);stroke-width:.5}
.vbar rect.hit{fill:transparent;cursor:pointer}
.hbars{display:flex;flex-direction:column;gap:16px}
.hb{display:grid;grid-template-columns:1fr auto;gap:6px 8px}
.hb .n{font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.hb .v{font-size:13px;color:var(--label2)}
.hb .mini{grid-column:1/-1;height:6px;border-radius:9px;background:var(--fill);overflow:hidden}
.hb .mini i{display:block;height:100%;border-radius:9px}
.big2{font-family:var(--disp);font-size:30px;font-weight:700;letter-spacing:-.2px;margin-top:2px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.mnav button{border:0;background:none;color:var(--tint);width:36px;height:36px;display:grid;place-items:center}
.mnav button .ic{width:22px;height:22px;stroke-width:2.2}
.mnav span{font-weight:600;font-size:17px}
.aside{font-size:13px;color:var(--label2)}
.lnk{border:0;background:none;color:var(--tint);font-size:15px;padding:0}
/* FAB + tab bar */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--prim);color:var(--on-prim);border:0;border-radius:99px;padding:13px 24px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px;box-shadow:0 10px 26px rgba(0,0,0,.22);z-index:9}
.fab .ic{width:20px;height:20px;stroke-width:2.4}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);padding:6px 0 calc(4px + env(safe-area-inset-bottom,0px));z-index:10}
.tabbar .in{max-width:500px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:500;color:#999;padding:2px 0 4px;letter-spacing:0}
.tabbar button[aria-current="page"]{color:var(--label)}
.tabbar .ic{width:27px;height:27px}
.tabbar button[aria-current="page"] .ic{fill:currentColor;fill-opacity:.18}
/* modal pages */
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page .ph{display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:8px 16px;max-width:500px;width:100%;margin:0 auto;min-height:52px}
.page .ph h3{margin:0;text-align:center;font-size:17px;font-weight:600}
.page .ph .r{justify-self:end}
.page .body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 16px 20px;max-width:500px;width:100%;margin:0 auto}
.page .pf{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:500px;width:100%;margin:0 auto}
.amt{text-align:center;padding-block:14px 14px}
.amt .v{font-family:var(--disp);font-size:48px;font-weight:700;letter-spacing:-.6px;line-height:1.15;word-break:break-all}
.amt .v small{font-size:30px;font-weight:600;margin-left:3px}
.amt .v.zero{color:var(--label3)}
.amt .v .caret{display:inline-block;width:3px;height:44px;border-radius:2px;background:var(--label);vertical-align:-6px;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.amt .k{font-size:15px;color:var(--tint);min-height:20px;margin-top:2px}
.quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.quick button{border:0;background:var(--cell);border-radius:99px;padding:6px 12px;font-size:14px;color:var(--label)}
.cellr input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;-webkit-appearance:none;appearance:none}
.memo{display:flex;gap:14px;align-items:flex-start;padding:12px 16px}
.memo textarea{margin-top:5px}
.memo .ic{color:var(--label2);margin-top:1px;width:20px;height:20px}
.memo textarea{flex:1;border:0;background:none;font:inherit;font-size:17px;color:var(--label);resize:none;min-height:24px;max-height:140px;padding:0;outline:none;line-height:1.4}
.memo textarea::placeholder{color:var(--label3)}
.cellwrap{position:relative}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:14px}
.pad button{border:0;border-radius:10px;height:50px;font-size:25px;font-weight:400;background:var(--cell);color:var(--label);touch-action:manipulation;box-shadow:0 1px 0 rgba(0,0,0,.18)}
.pad button:active{background:var(--fill2)}
.pad button.fn{background:transparent;box-shadow:none}
.pad .ic{width:26px;height:26px;margin:auto}
.btn{border:0;background:var(--cell);border-radius:14px;padding:12px 16px;font-size:17px;font-weight:600;color:var(--tint)}
.btn.prim{background:var(--prim);color:var(--on-prim)}
.btn.wide{width:100%;padding:15px;border-radius:14px}
.btn.del{color:var(--red)}
.half{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half .btn{width:100%;padding:15px}
.confirm{background:var(--cell);border-radius:12px;padding:12px 16px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:500px;border-radius:14px 14px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto}
.grab{width:36px;height:5px;border-radius:9px;background:var(--fill2);margin:0 auto 4px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shead h3{margin:0;font-size:20px;font-weight:700}
.chk{color:var(--tint);width:20px;height:20px;stroke-width:2.6}
/* editor */
.formlbl{font-size:13px;color:var(--label2);padding:20px 16px 7px}
input[type=text],input[inputmode]{font:inherit;color:var(--label);background:none;border:0;padding:11px 16px;width:100%;min-width:0;font-size:17px;outline:none}
.fcell{position:relative;display:flex;align-items:center}
.fcell+.fcell::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.datecell{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;position:relative;width:100%;color:var(--label)}
.datecell .v{color:var(--tint)}
.datecell .v.empty{color:var(--label3)}
.datecell input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:14px 16px}
.pick{aspect-ratio:1;max-width:100%;border-radius:10px;border:0;background:var(--fill);display:grid;place-items:center;color:var(--label2)}
.pick{padding:8px}.pick img{width:100%;height:100%;object-fit:contain}
.pick[aria-pressed="true"]{background:var(--cell);box-shadow:0 0 0 2px var(--label) inset}
.cpick{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--cell);box-shadow:0 0 0 2px transparent}
.cpick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--label2)}
.irow{display:grid;grid-template-columns:1fr 128px 36px;align-items:center}
.irow input[inputmode]{text-align:right;color:var(--label2)}
.irow .x{border:0;background:none;width:36px;height:36px;display:grid;place-items:center;color:var(--red)}
.irow .x .ic{width:20px;height:20px}
.addrow{border:0;background:none;color:var(--tint);padding:11px 16px;width:100%;text-align:left;font-size:17px;display:flex;align-items:center;gap:10px;position:relative}
.addrow::before{content:"";position:absolute;top:0;right:0;left:16px;height:.5px;background:var(--sep)}
.addrow .plusc{width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center}
.addrow .plusc .ic{width:14px;height:14px;stroke-width:3}
/* budget keypad (editor) */
.kpad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--cell2);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));border-top:.5px solid var(--sep)}
:root:not([data-theme="dark"]) .kpad{background:#D1D3D9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kpad{background:#2B2B2D}}
:root[data-theme="dark"] .kpad{background:#2B2B2D}
.kpad .in{max-width:500px;margin:0 auto}

/* resizable goal widgets */
.tiles.gres{grid-template-columns:1fr 1fr;grid-auto-rows:var(--row,170px);grid-auto-flow:dense}
.tile.rt{aspect-ratio:auto;height:100%;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:box-shadow .15s}
.tile.rt.sz-w{grid-column:span 2}
.tile.rt.sz-t{grid-row:span 2}
.tile.rt.sz-l{grid-column:span 2;grid-row:span 2}
.tile.rt .rbody{display:flex;flex-direction:column}
.tile.rt.sz-w .nm,.tile.rt.sz-l .nm{font-size:20px}
.tile.rt.sz-l .nm{font-size:24px}
.tile.rt .gc-row{margin-top:10px;font-size:14px}
.tile.rt.sz-t .gc-row{flex-direction:column;gap:4px}
.tile.rt.sz-l .gbar{height:10px}
.tile.rt.resizing{box-shadow:0 0 0 2px var(--green);z-index:2}
.grip{position:absolute;right:4px;bottom:4px;width:32px;height:32px;display:grid;place-items:center;touch-action:none;cursor:nwse-resize;color:var(--label3);border-radius:10px}
.grip svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.grip:active,.resizing .grip{color:var(--green)}
.tile.rt .gbar{margin-right:26px}
.tile.rt.sz-w .am1,.tile.rt.sz-l .am1{display:none}
.rhint{font-size:13px;color:var(--label3);text-align:center;margin-top:10px}

.fxc .fxr{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0}
.fxc .fxr span{font-size:15px;color:var(--label2)}
.fxc .fxr span em{font-style:normal;font-size:12px;color:var(--label3)}
.fxc .fxr b{font-size:16px;font-weight:700;text-align:right}
.fxlist{margin-top:14px;border-top:1px solid var(--sep)}
.fxi{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;width:100%;border:0;background:none;color:var(--label);text-align:left;padding:12px 0;border-bottom:1px solid var(--sep)}
.fxi .d{grid-row:span 2;font-size:14px;color:var(--label2);padding-top:1px}
.fxi .num{font-size:15px}.fxi .r{font-size:13px;color:var(--label2)}
.lnk{display:flex;align-items:center;gap:2px;color:var(--gtext);font-weight:700;font-size:15px;background:none;border:0}
.lnk .chev{width:15px;height:15px;stroke-width:2.4}
.curgrid{display:flex;flex-wrap:wrap;gap:8px}
.curgrid .chip{font-size:14px;padding:7px 12px}
.convrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--sep)}
.convrow:last-child{border-bottom:0}
.convrow span{font-size:16px;color:var(--label2);white-space:nowrap;min-width:92px}
.convrow input{text-align:right;font-size:26px;font-weight:800;background:none!important;margin:0!important}

.curbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--cell);color:var(--label);border-radius:99px;padding:8px 12px 8px 16px;font-size:15px;font-weight:600;margin-bottom:6px}
.curbtn b{font-size:16px}
.curbtn span{color:var(--label3);font-size:13px;font-weight:600}
.curbtn .cchev{width:14px;height:14px;stroke-width:2.4;color:var(--label2);transform:rotate(90deg)}
.cursym{width:40px;height:40px;border-radius:50%;background:var(--cell2);display:grid;place-items:center;font-weight:800;font-size:15px;color:var(--label)}
.selcell{position:relative}
.selcell select{-webkit-appearance:none;appearance:none;border:0;background:transparent;color:var(--gtext);font:inherit;font-size:17px;font-weight:600;text-align:right;text-align-last:right;padding:4px 26px 4px 8px;max-width:70%;cursor:pointer;outline:none}
.selcell select option{color:#111;background:#fff}
.selcell .cchev{position:absolute;right:14px;top:50%;margin-top:-8px;width:16px;height:16px;stroke-width:2.4;color:var(--gtext);transform:rotate(90deg);pointer-events:none}

.irow.irow4{grid-template-columns:1fr 84px 110px 32px;gap:6px}
.icur{-webkit-appearance:none;appearance:none;background:var(--cell2);border:0;border-radius:12px;color:var(--gtext);font:inherit;font-size:14px;font-weight:700;padding:13px 6px;text-align:center;text-align-last:center;margin:4px 0;width:100%}
.icur option{color:#111;background:#fff}
@media (max-width:370px){.irow.irow4{grid-template-columns:1fr 74px 96px 30px}}
</style>

/* ---------- calc ---------- */
const icur=it=>(it&&it.cur&&CURS[it.cur])?it.cur:"KRW";
const rateOf=(p,cur)=>cur==="KRW"?1:(krwPer(p,cur).rate||0);
function pcalc(p){
  const per={},perF={};p.items.forEach(i=>{per[i.id]=0;perF[i.id]=0});let spent=0;
  p.tx.forEach(t=>{const a=Number(t.amount)||0;spent+=a;if(per[t.itemId]===undefined)return;per[t.itemId]+=a;
    const it=p.items.find(i=>i.id===t.itemId);const cu=icur(it);
    if(cu==="KRW")perF[t.itemId]+=a;else if(t.fx&&t.fx.cur===cu)perF[t.itemId]+=Number(t.fx.amt)||0;else{const r=rateOf(p,cu);if(r)perF[t.itemId]+=a/r}});
  const budget=p.items.reduce((s,i)=>s+Number(i.budget||0)*rateOf(p,icur(i)),0);
  return{budget,spent,left:budget-spent,pct:budget?spent/budget*100:0,per,perF};
}
const fmtM=(cur,v)=>cur==="KRW"?short(v)+"원":fmtF(cur,Math.round(v*100)/100);
const itemColor=(p,id)=>PALETTE[Math.max(0,p.items.findIndex(i=>i.id===id))%PALETTE.length];
function statusTxt(s,b,cur){cur=cur||"KRW";if(!b)return `<span class="st" style="color:var(--label2)">예산 없음</span>`;if(s>b)return `<span class="st" style="color:var(--red)">${fmtM(cur,s-b)} 초과</span>`;if(Math.abs(s-b)<0.005)return `<span class="st" style="color:var(--green)">완료</span>`;return `<span class="st" style="color:var(--label2)">${fmtM(cur,b-s)} 남음</span>`}

function arcPath(cx,cy,r,ri,a0,a1){
  const p=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)];if(a1-a0>=Math.PI*2-1e-6)a1=a0+Math.PI*2-1e-4;
  const L=a1-a0>Math.PI?1:0;const[x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
  return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${L} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${ri},${ri} 0 ${L} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`;
}
function donut(ns,rows,label){
  rows=rows.filter(r=>r.v>0);const total=rows.reduce((s,r)=>s+r.v,0);
  if(!total)return `<div class="empty">이 기간에 기록한 지출이 없어요</div>`;
  const sel=rows.find(r=>r.id===ui.sel[ns])?ui.sel[ns]:null;let a=0;const C=90,R=80,RI=56;
  const slices=rows.map(r=>{const a0=a,a1=a+r.v/total*Math.PI*2;a=a1;const on=sel===r.id;const pc=(r.v/total*100).toFixed(1);
    return `<path d="${arcPath(C,C,on?R+4:R,RI,a0,a1)}" fill="${r.color}" stroke="var(--cell)" stroke-width="2" stroke-linejoin="round" opacity="${sel&&!on?0.28:1}" data-a="sel" data-ns="${ns}" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)} ${won(r.v)}원 ${pc}%"><title>${esc(r.name)} ${won(r.v)}원 (${pc}%)</title></path>`}).join("");
  const sr=sel&&rows.find(r=>r.id===sel);
  const center=sr?`<text x="${C}" y="${C-8}" text-anchor="middle" class="pc1">${esc(sr.name.length>7?sr.name.slice(0,7)+"…":sr.name)}</text><text x="${C}" y="${C+15}" text-anchor="middle" class="pc2">${(sr.v/total*100).toFixed(1)}%</text><text x="${C}" y="${C+31}" text-anchor="middle" class="pc3">${short(sr.v)}원</text>`
    :`<text x="${C}" y="${C-6}" text-anchor="middle" class="pc1">${label}</text><text x="${C}" y="${C+17}" text-anchor="middle" class="pc2">${short(total)}</text><text x="${C}" y="${C+33}" text-anchor="middle" class="pc3">원</text>`;
  const legend=[...rows].sort((x,y)=>y.v-x.v).map(r=>{const on=sel===r.id;return `<button class="lg${on?" on":""}${sel&&!on?" dim":""}" data-a="sel" data-ns="${ns}" data-id="${r.id}"><span class="dot" style="background:${r.color}"></span><span class="lgn">${esc(r.name)}</span><span class="lgv num">${short(r.v)}원</span><span class="lgp num">${(r.v/total*100).toFixed(1)}%</span></button>`}).join("");
  return `<div class="pie"><svg viewBox="0 0 180 180" width="160" height="160" role="img" aria-label="${label} 비율">${slices}${center}</svg><div class="lgs">${legend}</div></div>`;
}
function niceStep(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
/* bars: [{key,label,v}] */
function vbars(ns,bars,labelEvery){
  const W=340,H=170,L=38,B=22,T=10,Rr=4;const pw=W-L-4,ph=H-B-T;
  const vmax=Math.max(...bars.map(b=>b.v),0);const step=niceStep(Math.max(vmax,1)/3);const nt=Math.max(1,Math.ceil(vmax/step));const mx=step*nt;const sel=ui.sel[ns];const si=bars.findIndex(b=>b.key===sel);
  const slot=pw/bars.length;const bw=Math.max(3,Math.min(26,slot*.62));
  let g="";for(let i=0;i<=nt;i++){const y=T+ph-ph*i/nt;g+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${i?short(step*i):"0"}</text>`}
  const bs=bars.map((b,i)=>{const x=L+slot*i+(slot-bw)/2;const h=b.v?Math.max(2,b.v/mx*ph):0;const y=T+ph-h;const on=sel===b.key;const r=Math.min(Rr,bw/2,h);
    const path=h?`<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${y+h}Z" fill="var(--label)" opacity="${sel&&!on?0.3:1}"/>`:"";
    const near=si>-1&&!on&&Math.abs(i-si)*slot<22;const lab=((i%labelEvery===0&&!near)||on)?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" style="${on?"fill:var(--label);font-weight:700":""}">${b.label}</text>`:"";
    return `${path}${lab}<rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph+B}" data-a="sel" data-ns="${ns}" data-id="${b.key}" tabindex="0" role="button" aria-label="${b.aria||b.label} ${won(b.v)}원"><title>${b.aria||b.label} ${won(b.v)}원</title></rect>`}).join("");
  return `<svg class="vbar" viewBox="0 0 ${W} ${H}" role="img" aria-label="기간별 지출 막대 그래프">${g}${bs}</svg>`;
}

const CURS={KRW:{s:"₩",n:"원",u:1,d:0},JPY:{s:"¥",n:"엔",u:100,d:0},USD:{s:"$",n:"달러",u:1,d:2},EUR:{s:"€",n:"유로",u:1,d:2},CNY:{s:"元",n:"위안",u:1,d:2},TWD:{s:"NT$",n:"대만달러",u:1,d:0},THB:{s:"฿",n:"바트",u:1,d:2},VND:{s:"₫",n:"동",u:100,d:0},PHP:{s:"₱",n:"페소",u:1,d:2},HKD:{s:"HK$",n:"홍콩달러",u:1,d:2},SGD:{s:"S$",n:"싱가포르달러",u:1,d:2},GBP:{s:"£",n:"파운드",u:1,d:2},AUD:{s:"A$",n:"호주달러",u:1,d:2},CAD:{s:"C$",n:"캐나다달러",u:1,d:2},IDR:{s:"Rp",n:"루피아",u:100,d:0}};
const curOf=p=>(p&&p.cur&&CURS[p.cur])?p.cur:"KRW";

let RATES=null;try{RATES=JSON.parse(localStorage.getItem("hr_rates")||"null")}catch(e){}
let ratesLoading=false;
async function loadRates(force){
  if(ratesLoading)return;if(RATES&&!force&&Date.now()-RATES.ts<6*3600e3)return;ratesLoading=true;
  const srcs=[["https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/krw.min.json",j=>({date:j.date,r:j.krw})],
    ["https://latest.currency-api.pages.dev/v1/currencies/krw.min.json",j=>({date:j.date,r:j.krw})],
    ["https://open.er-api.com/v6/latest/KRW",j=>({date:(j.time_last_update_utc||"").slice(5,16),r:j.rates})]];
  for(const [u,f] of srcs){try{const res=await fetch(u,{cache:"no-store"});if(!res.ok)continue;const o=f(await res.json());const r={};
      for(const k in o.r)r[k.toUpperCase()]=Number(o.r[k]);if(!r.JPY)continue;RATES={ts:Date.now(),date:o.date,r};try{localStorage.setItem("hr_rates",JSON.stringify(RATES))}catch(e){}break}catch(e){}}

function pickerHTML(s,p){
  if(s.picker==="cur"){const gcur=curOf(p);const keys=[...new Set(["KRW",gcur,...Object.keys(CURS)])];

    ${RATES?`<div class="aside">기준 환율 ${esc(RATES.date||"")} · 하루 한 번 갱신</div>`:""}
    <div class="group">${keys.map(k=>{const c=CURS[k];const r=k==="KRW"?null:krwPer(p,k).rate;return `<button type="button" class="cellr" data-a="pk" data-id="${k}"><span class="cursym">${c.s}</span><div style="min-width:0"><div class="t1">${c.n} <span style="color:var(--label3);font-weight:500">${k}</span>${k===gcur&&k!=="KRW"?'<span class="badge">이 목표 통화</span>':""}</div>${r?`<div class="t2 num">${unitRate(k,r)}</div>`:""}</div><span></span>${(s.cur||"KRW")===k?ic("check","chk"):"<span></span>"}</button>`}).join("")}</div></div></div>`}
  const opts=s.picker==="goal"?state.projects.map(x=>({id:x.id,name:x.name,icon:x.icon,col:gc(x.grad),on:x.id===s.pid}))
    :(p?.items||[]).map((x,i)=>({id:x.id,name:x.name+(icur(x)!=="KRW"?` · ${icur(x)}`:""),icon:"tag",col:PALETTE[i%PALETTE.length],on:x.id===s.item}));
  return `<div class="scrim" data-a="pk-close"><div class="sheet" role="dialog"><div class="grab"></div><div class="shead"><h3>${s.picker==="goal"?"목표 선택":"세부 항목 선택"}</h3><button type="button" class="cbtn" style="color:var(--label2)" data-a="pk-close" aria-label="닫기">${ic("x")}</button></div>
  <div class="group">${opts.map(o=>`<button type="button" class="cellr" data-a="pk" data-id="${o.id}">${o.icon==="tag"?`<span class="idot" style="background:${o.col};margin:0 11px"></span>`:emo(o.icon,34,o.col)}<span class="t1">${esc(o.name)}</span><span></span>${o.on?ic("check","chk"):"<span></span>"}</button>`).join("")||'<div class="empty">이 목표에 세부 항목이 없어요</div>'}</div></div></div>`;

function autoGrow(t){if(!t)return;t.style.height="auto";t.style.height=Math.min(140,t.scrollHeight)+"px"}
function readTx(){const m=document.getElementById("t_memo");if(m)page.memo=m.value;const d=document.getElementById("t_date");if(d&&d.value)page.date=d.value}
function totalTxt(s){const p=state.projects.find(x=>x.id===s.id)||{fx:[],rateMode:null};const by={};let krw=0,miss=false;s.items.forEach(i=>{const c=icur(i);by[c]=(by[c]||0)+Number(i.budget||0);const r=rateOf(p,c);if(r)krw+=Number(i.budget||0)*r;else if(i.budget)miss=true});
  const parts=Object.keys(by).filter(k=>by[k]).map(k=>k==="KRW"?won(by[k])+"원":fmtF(k,by[k]));if(!parts.length)return "0원";const onlyKRW=parts.length===1&&by.KRW;return parts.join(" + ")+(onlyKRW?"":` <span style="color:var(--label2);font-weight:500">(≈ ${won(krw)}원${miss?"+":""})</span>`)}
function readProj(){const n=document.getElementById("pj_name");if(!n)return;const cs=document.getElementById("pj_cur");if(cs)page.cur=cs.value;page.name=n.value;page.date=document.getElementById("pj_date").value;
  page.items.forEach((it,i)=>{it.name=document.getElementById("pi_n_"+i).value;it.budget=moneyVal(document.getElementById("pi_b_"+i).value);const c=document.getElementById("pi_c_"+i);if(c)it.cur=c.value})}
function readFx(){const a=document.getElementById("fx_krw");if(!a)return;page.krw=moneyVal(a.value);page.foreign=moneyVal(document.getElementById("fx_for").value);const d=document.getElementById("fx_date");if(d&&d.value)page.date=d.value}
function removeTx(id){for(const p of state.projects){const i=p.tx.findIndex(t=>t.id===id);if(i>-1)p.tx.splice(i,1)}}
function commitTx(){
  readTx();const s=page;const val=Number(s.amt)||0;if(!val)return toast("금액을 입력해 주세요");
  const p=state.projects.find(x=>x.id===s.pid);if(!p)return toast("목표를 골라 주세요");if(!s.item)return toast("세부 항목을 골라 주세요");
  let amount=val,fx=null;if(s.cur&&s.cur!=="KRW"){const r=krwPer(p,s.cur);if(!r.rate)return toast("환율을 불러오지 못했어요. 원화로 입력하거나 환전 기록을 먼저 남겨 주세요");amount=Math.round(val*r.rate);fx={cur:s.cur,amt:val,rate:r.rate,src:r.src}}
  removeTx(s.id);const t={id:s.id,itemId:s.item,date:s.date,amount,memo:s.memo.trim()};if(fx)t.fx=fx;p.tx.push(t);persist();
  const msg=s.edit?"수정했어요":`${won(amount)}원 기록했어요`;page=null;drawPage();render();toast(msg);
}
function commitProj(){
  readProj();const s=page;const name=s.name.trim();if(!name)return toast("목표 이름을 입력해 주세요");
  const items=s.items.filter(i=>i.name.trim()||i.budget).map(i=>({id:i.id,name:i.name.trim()||"이름 없는 항목",budget:i.budget,cur:icur(i)}));
  if(items.some(i=>i.cur!=="KRW"))loadRates();
  let p=state.projects.find(x=>x.id===s.id);
  if(p){Object.assign(p,{name,icon:s.icon,grad:s.grad,cur:s.cur||"KRW",date:s.date,items});const ids=new Set(items.map(i=>i.id));p.tx.forEach(t=>{if(!ids.has(t.itemId)&&items[0])t.itemId=items[0].id})}
  else{p={id:s.id,name,icon:s.icon,grad:s.grad,cur:s.cur||"KRW",date:s.date,items,tx:[]};state.projects.push(p)}
  if(p.cur!=="KRW")loadRates();
  persist();const isNew=s.isNew;hidePad();page=null;drawPage();ui.tab="goals";ui.proj=p.id;ui.pview="items";render();window.scrollTo({top:0});toast(isNew?"목표를 만들었어요":"저장했어요");
}

    <div class="card" style="display:flex;align-items:center;gap:16px">${ring(b?sp/b*100:0,sp>b?"var(--red)":col,Math.round(b?sp/b*100:0)+"%",64)}<div><div class="big2 num" style="margin:0">${W(sp)}</div><div class="aside num" style="font-size:15px">예산 ${W(b)} · ${sp>b?`${W(sp-b)} 초과`:`${W(b-sp)} 남음`}${cu!=="KRW"&&c.per[it.id]?` · ≈ ${won(c.per[it.id])}원`:""}</div></div></div>
    ${txs.length?`<div class="group">${txs.map(t=>txRow(p,t,false).replace('<div class="t2">',`<div class="t2">${md(t.date)} · `)).join("")}</div>`:'<div class="empty">아직 이 항목에 쓴 돈이 없어요</div>'}

    <button class="cellr" data-a="bk-export">${emo("x_memo",32)}<span class="t1">백업 파일 저장하기</span><span class="val" style="font-size:14px">${lb?md(lb):"기록 없음"}</span>${ic("chev","chev")}</button>

  </div>
  <div class="group">${s.confirm?`<div class="confirm" style="margin:0"><span>모든 목표와 기록을 지울까요?</span><span style="display:flex;gap:8px"><button class="btn" style="padding:8px 14px;background:var(--fill)" data-a="bk-resetno">취소</button><button class="btn del" style="padding:8px 14px;background:var(--fill)" data-a="bk-resetyes">모두 지우기</button></span></div>`:`<button class="cellr" data-a="bk-reset" style="color:var(--red);justify-content:center;display:flex">모든 기록 지우기</button>`}</div>
  </div></div>`;

function exportData(){
  const blob=new Blob([JSON.stringify({app:"haru-budget",version:2,exportedAt:new Date().toISOString(),state},null,1)],{type:"application/json"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`하루예산_백업_${todayKey}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{localStorage.setItem("hr_lastbackup",todayKey)}catch(e){}toast("백업 파일을 저장했어요");if(sheet)drawSheet();
}
function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const st=j.state||j;if(!st||!Array.isArray(st.projects))throw 0;
  state={categories:[],months:{},example:false,projects:[],projSeeded:true,...st};persist();sheet=null;drawSheet();ui.proj=null;render();toast("백업을 불러왔어요")}catch(e){toast("하루예산 백업 파일이 아니에요")}};r.readAsText(file)}
function toast(t){const s=document.getElementById("toastSlot");s.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>s.innerHTML="",1800)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,d=el.dataset;
  if((a==="s-close"||a==="pk-close")&&el.classList.contains("scrim")&&e.target!==el)return;
  switch(a){
    case "tab":ui.tab=d.t;ui.proj=null;saveUi();render();window.scrollTo({top:0});break;
    case "gview":ui.gview=d.v;saveUi();render();break;
    case "pview":ui.pview=d.v;saveUi();render();break;
    case "open-proj":ui.tab="goals";ui.proj=d.id;render();window.scrollTo({top:0});break;
    case "back":ui.proj=null;render();window.scrollTo({top:0});break;
    case "item":sheet={kind:"item",pid:ui.proj,id:d.id};drawSheet();break;
    case "sel":ui.sel[d.ns]=ui.sel[d.ns]===d.id&&d.ns!=="s_m"?null:d.id;render();break;
    case "stat":ui.stat=d.v;saveUi();render();break;
    case "stat-goal":ui.statGoal=d.id;ui.sel={};render();break;
    case "sm-prev":ui.statMonth=shiftMonth(ui.statMonth,-1);ui.sel.s_d=null;render();break;
    case "sm-next":ui.statMonth=shiftMonth(ui.statMonth,1);ui.sel.s_d=null;render();break;
    case "clear-exp":state.projects=state.projects.filter(p=>!p.example);persist();ui.proj=null;render();toast("예시 목표를 지웠어요");break;
    case "add-tx":openTx({pid:d.pid,item:d.item});break;
    case "tx-edit":{const p=state.projects.find(x=>x.id===d.pid);const t=p&&p.tx.find(x=>x.id===d.id);if(t)openTx({edit:true,id:t.id,pid:p.id,item:t.itemId,amount:t.amount,memo:t.memo||"",date:t.date,fx:t.fx});break}
    case "new-proj":openProj(null);break;
    case "conv":sheet={kind:"conv",pid:d.id};drawSheet();loadRates();break;
    case "ratemode":{const p=state.projects.find(x=>x.id===d.id);p.rateMode=d.v;persist();render();break}
    case "fx-new":{const p=state.projects.find(x=>x.id===d.pid);page={kind:"fx",id:uid(),pid:p.id,cur:curOf(p),krw:0,foreign:0,date:todayKey,edit:false,confirm:false};drawPage();loadRates();break}
    case "fx-edit":{const p=state.projects.find(x=>x.id===d.pid);const f=(p.fx||[]).find(x=>x.id===d.id);if(f){page={kind:"fx",...f,pid:p.id,edit:true,confirm:false};drawPage()}break}
    case "fx-fill":{readFx();const live=liveKrwPer(page.cur);if(page.krw&&live){page.foreign=Math.round(page.krw/live);drawPage()}else toast("낸 원화를 먼저 입력해 주세요");break}
    case "fx-save":{readFx();const s=page;if(!s.krw||!s.foreign)return toast("낸 원화와 받은 금액을 모두 입력해 주세요");const p=state.projects.find(x=>x.id===s.pid);p.fx=(p.fx||[]).filter(x=>x.id!==s.id);p.fx.push({id:s.id,date:s.date,cur:s.cur,krw:s.krw,foreign:s.foreign});persist();hidePad();page=null;drawPage();render();toast("환전을 기록했어요");break}
    case "fx-del":readFx();page.confirm=true;drawPage();break;
    case "fx-delno":page.confirm=false;drawPage();break;
    case "fx-delyes":{const p=state.projects.find(x=>x.id===page.pid);p.fx=(p.fx||[]).filter(x=>x.id!==page.id);persist();hidePad();page=null;drawPage();render();toast("삭제했어요");break}
    case "t-cur":readTx();page.cur=d.v;page.amt="";drawPage();if(d.v!=="KRW")loadRates();break;
    case "pj-cur":readProj();page.cur=d.v;drawPage();break;
    case "edit-proj":openProj(state.projects.find(x=>x.id===d.id));break;
    case "backup":sheet={kind:"backup",confirm:false};drawSheet();break;
    case "bk-export":exportData();break;
    case "bk-reset":sheet.confirm=true;drawSheet();break;
    case "bk-resetno":sheet.confirm=false;drawSheet();break;
    case "bk-resetyes":state={categories:[],months:{},example:false,projects:[],projSeeded:true};persist();sheet=null;drawSheet();ui.proj=null;ui.tab="goals";render();toast("모두 지웠어요");break;
    case "s-close":sheet=null;drawSheet();break;
    case "p-close":hidePad();page=null;drawPage();if(ui.proj&&sheet)drawSheet();break;
    case "q":page.amt=d.v==="0"?"":String(Math.round(((Number(page.amt)||0)+Number(d.v))*100)/100);document.getElementById("amtBox").innerHTML=amtHTML();break;
    case "pick":readTx();page.picker=d.v;drawPage();if(d.v==="cur")loadRates();break;
    case "pk-close":page.picker=null;drawPage();break;
    case "pk":if(page.picker==="cur"){if(page.cur!==d.id){page.cur=d.id;page.amt="";if(d.id!=="KRW")loadRates()}page.picker=null;drawPage();break}if(page.picker==="goal"){if(page.pid!==d.id){page.pid=d.id;const p=state.projects.find(x=>x.id===d.id);page.item=p?.items[0]?.id||"";page.cur=curOf(p);page.amt="";if(page.cur!=="KRW")loadRates()}}else{page.item=d.id;const pp=state.projects.find(x=>x.id===page.pid);const it=pp&&pp.items.find(x=>x.id===d.id);const cu=it&&it.cur?icur(it):curOf(pp);if(cu!==page.cur){page.cur=cu;page.amt="";if(cu!=="KRW")loadRates()}}page.picker=null;drawPage();break;
    case "t-save":commitTx();break;
    case "t-del":readTx();page.confirm=true;drawPage();break;
    case "t-delno":page.confirm=false;drawPage();break;
    case "t-delyes":removeTx(page.id);persist();page=null;drawPage();render();toast("삭제했어요");break;
    case "pj-icon":readProj();page.icon=d.v;drawPage();break;
    case "pj-grad":readProj();page.grad=d.v;drawPage();break;
    case "pj-add":readProj();page.items.push({id:"i_"+uid(),name:"",budget:0,cur:page.cur||"KRW"});drawPage();setTimeout(()=>document.getElementById("pi_n_"+(page.items.length-1))?.focus(),30);break;
    case "pj-rm":readProj();page.items.splice(Number(d.idx),1);drawPage();break;
    case "pj-del":readProj();page.confirm=true;drawPage();break;
    case "pj-delno":page.confirm=false;drawPage();break;
    case "pj-save":commitProj();break;
    case "pj-delyes":{const id=page.id;state.projects=state.projects.filter(p=>p.id!==id);persist();page=null;drawPage();ui.proj=null;render();toast("목표를 삭제했어요");break}
  }
});
document.addEventListener("click",e=>{const b=e.target.closest("#tpad [data-k]");if(!b||!page||page.kind!=="tx")return;const k=b.dataset.k;let cur=page.amt||"";
  if(k==="back")cur=cur.slice(0,-1);else if(k==="000"){if(!cur)return;cur+="000"}else if(k==="."){if(cur.includes("."))return;cur=(cur||"0")+"."}else{if(cur.includes(".")&&cur.split(".")[1].length>=2)return;cur=(cur==="0"?"":cur)+k}
  if(cur.length>13)return;page.amt=cur;document.getElementById("amtBox").innerHTML=amtHTML()});
document.addEventListener("pointerdown",e=>{if(e.target.closest("#tpad"))e.preventDefault()});
document.addEventListener("input",e=>{const t=e.target;
  if((t.id==="cv_f"||t.id==="cv_k")&&sheet&&sheet.kind==="conv"){const p=state.projects.find(x=>x.id===sheet.pid);const r=krwPer(p,curOf(p)).rate;if(!r)return;const v=Number(String(t.value).replace(/[^\d.]/g,""))||0;
    if(t.id==="cv_f"){sheet.f=t.value;sheet.k=v?won(v*r):"";document.getElementById("cv_k").value=sheet.k}else{sheet.k=t.value;const f=v/r;sheet.f=v?f.toLocaleString("ko-KR",{maximumFractionDigits:CURS[curOf(p)].d}):"";document.getElementById("cv_f").value=sheet.f}return}
  if(t.id==="t_memo"){autoGrow(t);return}
  if(t.hasAttribute&&t.hasAttribute("data-money")){const n=moneyVal(t.value);t.value=n?won(n):"";if((t.id==="fx_krw"||t.id==="fx_for")&&page&&page.kind==="fx"){readFx();const k=page.krw,f=page.foreign,live=liveKrwPer(page.cur);document.getElementById("fx_rate").textContent=k&&f?unitRate(page.cur,k/f):"-";document.getElementById("fx_cmp").textContent=k&&f&&live?`기준 환율 대비 ${(k/f)<=live?"유리하게":"불리하게"} ${Math.abs(((k/f)/live-1)*100).toFixed(1)}%`:"금액 두 개를 넣으면 환율이 자동 계산돼요"}
    if(t.id.startsWith("pi_b_")&&page){readProj();const tot=document.getElementById("pj_total");if(tot)tot.innerHTML=totalTxt(page)}}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="pj_cur"&&page&&page.kind==="proj"){const old=page.cur||"KRW";readProj();page.items.forEach(it=>{if(icur(it)===old)it.cur=page.cur});drawPage();if(page.cur!=="KRW")loadRates();return}
  if(t.id&&t.id.startsWith("pi_c_")&&page){readProj();const tot=document.getElementById("pj_total");if(tot)tot.innerHTML=totalTxt(page);const b=document.getElementById("pi_b_"+t.id.slice(5));if(b)b.dataset.cur=t.value;if(t.value!=="KRW")loadRates();return}
  if(t.id==="bk_file"&&t.files&&t.files[0])importData(t.files[0]);
  if(t.id==="fx_date"&&t.value){page.date=t.value;document.getElementById("fxDateV").textContent=md(t.value)}
  if(t.id==="t_date"&&t.value){page.date=t.value;document.getElementById("dateV").textContent=md(t.value)}
  if(t.id==="pj_date"){const v=document.getElementById("pjDateV");v.textContent=t.value?fmtDate(t.value):"선택 안 함";v.classList.toggle("empty",!t.value)}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(page&&page.picker){page.picker=null;drawPage();return}if(page){hidePad();page=null;drawPage();return}if(sheet){sheet=null;drawSheet();return}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("svg [data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});

/* ---------- budget keypad for goal editor ---------- */
const kpad=document.getElementById("kpad");document.getElementById("kpadKeys").innerHTML=padKeys();let kTarget=null,kHide=null;
function updPad(){if(!kTarget)return;const n=moneyVal(kTarget.value);const cu=kTarget.dataset.cur||"KRW";if(cu!=="KRW"){const p=state.projects.find(x=>x.id===(page&&(page.id||page.pid)))||{fx:[]};const r=rateOf(p,cu);document.getElementById("kpadVal").innerHTML=`<small style="margin:0 3px 0 0">${CURS[cu].s}</small>${n.toLocaleString("ko-KR")}`;document.getElementById("kpadKor").textContent=r&&n?`≈ ${won(n*r)}원`:"";return}document.getElementById("kpadVal").innerHTML=won(n)+"<small>원</small>";document.getElementById("kpadKor").textContent=korMoney(n)}
function showPad(t){clearTimeout(kHide);kTarget=t;kpad.hidden=false;document.body.classList.add("kb");
  const nm=document.getElementById("pi_n_"+t.id.slice(5));document.getElementById("kpadLabel").textContent=t.dataset.label||(((nm&&nm.value.trim())||"항목")+" 예산");updPad();
  setTimeout(()=>{const sc=t.closest(".body");if(!sc)return;const r=t.getBoundingClientRect();const limit=window.innerHeight-kpad.offsetHeight-16;if(r.bottom>limit)sc.scrollBy({top:r.bottom-limit+8,behavior:"smooth"});else if(r.top<70)sc.scrollBy({top:r.top-90,behavior:"smooth"})},60)}
function hidePad(){kpad.hidden=true;document.body.classList.remove("kb");kTarget=null}
document.addEventListener("focusin",e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute("data-money"))showPad(t)});
document.addEventListener("focusout",e=>{if(e.target===kTarget){kHide=setTimeout(()=>{const a=document.activeElement;if(!(a&&a.hasAttribute&&a.hasAttribute("data-money")))hidePad()},150)}});
kpad.addEventListener("pointerdown",e=>e.preventDefault());
kpad.addEventListener("mousedown",e=>e.preventDefault());
kpad.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b||!kTarget)return;const k=b.dataset.k;const t=kTarget;
  if(k==="done"){t.blur();hidePad();return}
  let cur=String(t.value).replace(/[^\d]/g,"");
  if(k==="back")cur=cur.slice(0,-1);else if(k==="000"){if(!cur||cur==="0"){t.focus();return}cur+="000"}else cur=(cur==="0"?"":cur)+k;
  if(cur.length>13)return;t.value=cur?won(Number(cur)):"";t.dispatchEvent(new Event("input",{bubbles:true}));updPad();t.focus()});
/* ---------- widget-style resize ---------- */
let rz=null;
document.addEventListener("pointerdown",e=>{const h=e.target.closest("[data-grip]");if(!h)return;e.preventDefault();e.stopPropagation();
  const tile=h.closest(".tile");const g=document.getElementById("gres");const r=tile.getBoundingClientRect();const row=parseFloat(getComputedStyle(g).getPropertyValue("--row"))||r.width;
  rz={id:h.dataset.grip,tile,x0:r.left,y0:r.top,row,col:(g.clientWidth-12)/2,size:tile.className.match(/sz-(\w)/)[1],moved:false};tile.classList.add("resizing");h.setPointerCapture&&h.setPointerCapture(e.pointerId)},{passive:false});
document.addEventListener("pointermove",e=>{if(!rz)return;e.preventDefault();const w=e.clientX-rz.x0,h=e.clientY-rz.y0;rz.moved=true;
  const wide=w>rz.col*1.45,tall=h>rz.row*1.45;const sz=wide&&tall?"l":wide?"w":tall?"t":"s";
  if(sz!==rz.size){rz.tile.classList.remove("sz-"+rz.size);rz.tile.classList.add("sz-"+sz);rz.size=sz;if(navigator.vibrate)try{navigator.vibrate(8)}catch(_){}}},{passive:false});
function endRz(){if(!rz)return;const p=state.projects.find(x=>x.id===rz.id);const moved=rz.moved;rz.tile.classList.remove("resizing");
  if(p&&moved&&(p.size||"s")!==rz.size){p.size=rz.size;persist()}rz=null;window.__rzJust=moved;setTimeout(()=>{window.__rzJust=false},250);render()}
document.addEventListener("pointerup",endRz);document.addEventListener("pointercancel",endRz);
document.addEventListener("click",e=>{if(window.__rzJust||e.target.closest("[data-grip]")){e.stopImmediatePropagation();e.preventDefault()}},true);
init();
})();
</script>
