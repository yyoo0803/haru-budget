<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루예산">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2216%22 fill=%22%231E6BFF%22/%3E%3Ctext x=%2232%22 y=%2244%22 font-size=%2234%22 text-anchor=%22middle%22 fill=%22white%22 font-family=%22sans-serif%22 font-weight=%22bold%22%3E%E2%82%A9%3C/text%3E%3C/svg%3E">
<title>하루예산</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#E7EEF7; --glow1:rgba(120,180,255,.35); --glow2:rgba(80,220,210,.22);
  --surface:rgba(255,255,255,.78); --solid:#FFFFFF; --soft:#F1F5FB; --edge:rgba(255,255,255,.9); --line:#E1E8F2;
  --ink:#16213A; --ink2:#55627A; --ink3:#8A96AB; --track:#E3EAF4;
  --blue:#1E6BFF; --blue2:#4FACFE; --teal1:#2BD9C5; --teal2:#1C9BE8;
  --good:#12A36D; --good-soft:#DDF5EB; --warn:#C27A00; --warn-soft:#FFF1D6; --bad:#E0445A; --bad-soft:#FDE3E7;
  --shadow:0 10px 30px rgba(40,80,150,.12),0 2px 6px rgba(40,80,150,.06);
  --shadow-s:0 4px 14px rgba(40,80,150,.10);
  --font:"Nunito","IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0C1322; --glow1:rgba(40,90,200,.25); --glow2:rgba(20,150,150,.15);
  --surface:rgba(24,34,56,.82); --solid:#172136; --soft:#1E2A42; --edge:rgba(255,255,255,.06); --line:#26324B;
  --ink:#EAF0FA; --ink2:#A9B6CC; --ink3:#7584A0; --track:#26324B;
  --blue:#4C8DFF; --good:#3DD39A; --good-soft:#123A2E; --warn:#F2B33D; --warn-soft:#3A2F16; --bad:#FF6F84; --bad-soft:#3E1C25;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 4px 14px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C1322; --glow1:rgba(40,90,200,.25); --glow2:rgba(20,150,150,.15);
  --surface:rgba(24,34,56,.82); --solid:#172136; --soft:#1E2A42; --edge:rgba(255,255,255,.06); --line:#26324B;
  --ink:#EAF0FA; --ink2:#A9B6CC; --ink3:#7584A0; --track:#26324B;
  --blue:#4C8DFF; --good:#3DD39A; --good-soft:#123A2E; --warn:#F2B33D; --warn-soft:#3A2F16; --bad:#FF6F84; --bad-soft:#3E1C25;
  --shadow:0 10px 30px rgba(0,0,0,.35); --shadow-s:0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{background:var(--bg);height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px)!important}
img{max-width:100%}[hidden]{display:none!important}
body{background:var(--bg);background-image:radial-gradient(600px 400px at 10% -5%,var(--glow1),transparent 70%),radial-gradient(500px 380px at 110% 30%,var(--glow2),transparent 70%);background-attachment:fixed;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:0 130px;min-height:100%}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.screen{display:flex;flex-direction:column;gap:16px}
.screen>.banner+.banner{margin-top:-8px}
.num{font-variant-numeric:tabular-nums;font-family:"Nunito","IBM Plex Sans KR",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;padding-top:18px;gap:10px}
.logo{font-weight:900;font-size:22px;letter-spacing:-.5px;line-height:1;display:flex;align-items:center;gap:8px}
.logo b{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--blue2),var(--blue));display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:var(--shadow-s)}
.logo span{color:var(--blue)}
.pagehead{display:flex;align-items:center;gap:10px;padding-top:18px}
.pagehead h1{font-size:20px;margin:0;font-weight:800;flex:1}
.iconbtn{width:40px;height:40px;border-radius:14px;border:1px solid var(--edge);background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow-s);color:var(--ink)}
.mnav{display:flex;align-items:center;background:var(--surface);border:1px solid var(--edge);border-radius:999px;padding:3px;box-shadow:var(--shadow-s)}
.mnav button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:17px;color:var(--ink2)}
.mnav .m{font-weight:800;min-width:82px;text-align:center;font-size:14px}
.glass{background:var(--surface);border:1px solid var(--edge);border-radius:24px;box-shadow:var(--shadow);padding:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.sec{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.sec h2{font-size:16px;margin:0;font-weight:800}
.sec .more{border:0;background:none;color:var(--blue);font-size:13px;font-weight:700;padding:0}
.aside{font-size:12px;color:var(--ink3)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border-radius:16px;padding:10px 14px;font-size:13px}
.banner button{border:0;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:700;white-space:nowrap}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 20px;color:#fff;box-shadow:0 16px 36px rgba(30,107,255,.28);display:flex;flex-direction:column;gap:12px;isolation:isolate}
.hero .wave{position:absolute;inset:auto 0 0 0;width:100%;height:70%;z-index:-1;opacity:.22}
.hero .lbl{font-size:13px;opacity:.9;font-weight:600}
.hero .big{font-size:46px;font-weight:900;line-height:1;letter-spacing:-1px}
.hero .big small{font-size:20px;margin-left:3px;font-weight:800}
.hero .sub{font-size:13px;opacity:.92}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-top:12px;border-top:1px solid rgba(255,255,255,.25)}
.hero .stats b{display:block;font-size:15px;font-weight:800}
.hero .stats span{font-size:11px;opacity:.85}
.meter{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .deco{position:absolute;right:-14px;top:-14px;width:120px;height:120px;opacity:.16;z-index:-1;color:#fff}
.hero .deco .ic{width:120px;height:120px;stroke-width:1.2}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink2);padding:0}
.tile i{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;color:#fff;box-shadow:0 8px 18px rgba(30,107,255,.25);position:relative;overflow:hidden}
.tile i::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 55%)}
.tile i .ic{width:26px;height:26px}
/* goal cards */
.gcard{position:relative;overflow:hidden;border:0;width:100%;text-align:left;border-radius:24px;padding:18px 18px 16px;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 26px rgba(30,80,160,.18);isolation:isolate}
.gcard .deco{position:absolute;right:-10px;bottom:-16px;opacity:.2;z-index:-1}
.gcard .deco .ic{width:96px;height:96px;stroke-width:1.3}
.gcard .shine{position:absolute;inset:0;background:linear-gradient(150deg,rgba(255,255,255,.28),transparent 45%);z-index:-1}
.gcard .row1{display:flex;align-items:center;gap:10px}
.gcard .gi{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.25);display:grid;place-items:center}
.gcard .gname{font-weight:800;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcard .dday{font-size:12px;font-weight:800;background:rgba(255,255,255,.25);padding:2px 9px;border-radius:99px;white-space:nowrap}
.gcard .amts{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;gap:8px}
.gcard .amts b{font-size:22px;font-weight:900}
.gcard .ex{white-space:nowrap;font-size:10px;font-weight:800;background:rgba(0,0,0,.18);padding:1px 7px;border-radius:99px}
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ggrid .gcard{padding:16px;min-height:170px;justify-content:space-between}
.ggrid .gcard .gname{font-size:15px;white-space:normal}
.ggrid .pct{font-size:30px;font-weight:900;line-height:1}
.glist{display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.grow:last-child{border-bottom:0}
.grow .gi{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#fff;grid-row:span 2}
.grow .n{font-weight:800;display:flex;gap:6px;align-items:center;min-width:0}
.grow .a{font-size:13px;font-weight:700;text-align:right}
.grow .bar{grid-column:2/-1}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
/* summary strip */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.strip div{background:var(--soft);border-radius:16px;padding:10px 4px}
.strip b{display:block;font-size:15px;font-weight:900}
.strip span{font-size:11px;color:var(--ink3);font-weight:600}
/* seg */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:7px 8px;font-size:13px;color:var(--ink2);font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--solid);color:var(--blue);box-shadow:var(--shadow-s)}
.seg .ic{width:17px;height:17px}
.seg.sm button{padding:4px 9px;font-size:12px}
/* categories */
.cats{display:flex;flex-direction:column;gap:16px}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:5px 10px;align-items:center}
.dot{width:10px;height:10px;border-radius:4px;display:inline-block;flex:none}
.cat .name{font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.cat .name em{font-style:normal;font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:0 5px}
.cat .amt{font-size:13px;color:var(--ink2);text-align:right;font-weight:700}
.cat .bar{grid-column:1/-1}
.cat .foot{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);gap:8px}
.pill{font-size:11px;font-weight:800;padding:1px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--bad-soft);color:var(--bad)}
/* items (goal detail) */
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>button{display:grid;grid-template-columns:auto 1fr auto auto;gap:5px 10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:13px 2px}
.item .n{font-weight:700;display:flex;gap:6px;align-items:center;min-width:0}
.item .a{font-size:13px;font-weight:700;color:var(--ink2);text-align:right}
.item .bar{grid-column:1/-1}
.item .chev{color:var(--ink3);transition:transform .2s}
.item.open .chev{transform:rotate(90deg)}
.item .sub{padding:0 2px 12px;display:flex;flex-direction:column;gap:6px}
/* tx */
.txday{font-size:12px;color:var(--ink3);font-weight:700;display:flex;justify-content:space-between;padding:12px 2px 6px}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:9px 6px;border:0;background:none;width:100%;text-align:left;border-radius:14px}
.tx:hover{background:var(--soft)}
.tx .ti{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.tx .ti .ic{width:19px;height:19px}
.tx .t1{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12px;color:var(--ink3)}
.tx .a{font-weight:800}
.empty{color:var(--ink3);font-size:14px;text-align:center;padding:22px 0}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:11px;color:var(--ink3);text-align:center;font-weight:700}
.cal .d{aspect-ratio:1/1.1;max-width:100%;border-radius:12px;background:var(--soft);display:flex;flex-direction:column;justify-content:space-between;padding:4px 5px;font-size:11px;border:1.5px solid transparent;min-width:0}
.cal .d .dn{color:var(--ink2);font-weight:800}
.cal .d .dv{font-size:10px;text-align:right;overflow:hidden;white-space:nowrap;font-weight:700}
.cal .d.under{background:var(--good-soft)}
.cal .d.over{background:var(--bad-soft)}
.cal .d.over .dv{color:var(--bad)}
.cal .d.today{border-color:var(--blue)}
.cal .d.blank{background:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin-top:12px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}
/* donut */
.pie{display:grid;grid-template-columns:170px 1fr;gap:14px;align-items:center}
.pie svg{max-width:100%;height:auto;overflow:visible}
.pie path{cursor:pointer;transition:opacity .15s}
.pie path:focus-visible{outline:none;stroke:var(--ink)}
.pc1{font-size:12px;fill:var(--ink2);font-family:var(--font);font-weight:600}
.pc2{font-size:19px;fill:var(--ink);font-weight:900;font-family:var(--font)}
.pc3{font-size:11px;fill:var(--ink3);font-family:var(--font)}
.lgs{display:flex;flex-direction:column;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:auto 1fr auto 46px;gap:2px 8px;align-items:center;border:0;background:none;text-align:left;padding:6px 8px;border-radius:10px;width:100%}
.lg:hover,.lg.on{background:var(--soft)}
.lg.dim{opacity:.45}
.lgn{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgv{font-size:12px;color:var(--ink3);text-align:right}
.lgp{font-size:13px;font-weight:800;text-align:right}
.hbars{display:flex;flex-direction:column;gap:14px}
.hb{display:grid;grid-template-columns:1fr auto;gap:4px 8px;border:0;background:none;text-align:left;padding:0;width:100%}
.hb .n{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px}
.hb .v{font-size:12px;color:var(--ink2);font-weight:700}
.hb .bar{grid-column:1/-1;height:12px;position:relative}
.hint{font-size:12px;color:var(--ink3);margin-top:10px}
/* buttons & forms */
.btn{border:1px solid var(--line);background:var(--solid);border-radius:14px;padding:9px 14px;font-size:13px;font-weight:700}
.btn.primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(30,107,255,.3)}
.btn.danger{color:var(--bad)}
.btn.wide{width:100%;padding:13px;font-size:15px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=date],input[inputmode]{font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 11px;width:100%;min-width:0}
.ce{display:grid;grid-template-columns:auto 1fr 118px auto;gap:8px;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--line)}
.ce .swatch{width:28px;height:28px;border-radius:9px;border:0}
.ce .opts{grid-column:2/-1;font-size:12px;color:var(--ink2)}
.catedit{display:flex;flex-direction:column;gap:12px}
.totalrow{display:flex;justify-content:space-between;font-size:14px}
.totalrow b{font-size:16px;font-weight:900}
.confirm{background:var(--bad-soft);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px;grid-column:1/-1;flex-wrap:wrap}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:480px;background:var(--solid);border-radius:26px 26px 0 0;box-shadow:0 -6px 24px rgba(40,80,150,.12);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--ink3);padding:4px 0}
.nav button[aria-current="page"]{color:var(--blue)}
.nav .plus{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;margin:-30px auto 0;box-shadow:0 10px 22px rgba(30,107,255,.4);display:grid;place-items:center;padding:0}
.nav .plus .ic{width:28px;height:28px;stroke-width:2.4}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--solid);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:92%;overflow:auto}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:17px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink2);font-weight:700}
.amount-wrap{display:flex;align-items:baseline;gap:4px;border-bottom:2px solid var(--blue);padding-bottom:4px}
.amount-wrap .amount-in{font-size:38px;font-weight:900;border:0;background:none;padding:0;border-radius:0;font-family:"Nunito",sans-serif}
.amount-in:focus{outline:none}
.amount-wrap span{font-size:18px;color:var(--ink2);font-weight:700}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--solid);border-radius:99px;padding:6px 12px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:700}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .ic{width:16px;height:16px}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick{aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;background:var(--soft);display:grid;place-items:center;color:var(--ink2)}
.pick[aria-pressed="true"]{border-color:var(--blue);color:var(--blue)}
.gpick{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--solid);box-shadow:0 0 0 2px transparent}
.gpick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--blue)}
.irow{display:grid;grid-template-columns:1fr 130px auto;gap:6px;align-items:center}
.irow .x{border:0;background:var(--soft);width:34px;height:34px;border-radius:10px;color:var(--ink3);font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:13px;font-weight:700;z-index:30}
.status{font-size:11px;color:var(--ink3);text-align:center}

(function(){

const GOAL_ICONS=["cake","house","ring","plane","car","gift","heart","baby","grad","paw","star","wallet"];
const ic=(n,cls="")=>`<svg viewBox="0 0 24 24" class="ic ${cls}" aria-hidden="true"><path d="${P[n]||P.star}"/></svg>`;
const gbg=g=>{const c=GRADS[g]||GRADS.sky;return `background:linear-gradient(135deg,${c[0]},${c[1]})`};
const WD=["일","월","화","수","목","금","토"];
const won=n=>Math.round(n).toLocaleString("ko-KR");

const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const curMonth=todayKey.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);

const daysIn=m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()};
const shiftMonth=(m,d)=>{const[y,mm]=m.split("-").map(Number);const t=new Date(y,mm-1+d,1);return `${t.getFullYear()}-${pad(t.getMonth()+1)}`};
const moneyVal=v=>Number(String(v).replace(/[^\d]/g,""))||0;
const dday=d=>{if(!d)return "";const t=new Date(d+"T00:00"),n=new Date(todayKey+"T00:00");const x=Math.round((t-n)/864e5);return x>0?`D-${x}`:x===0?"D-DAY":`D+${-x}`};
const fmtDate=d=>{const t=new Date(d+"T00:00");return `${t.getMonth()+1}월 ${t.getDate()}일 (${WD[t.getDay()]})`};

/* ---------- state ---------- */
let state={categories:[],months:{},example:false,projects:[],projSeeded:false};

try{const s=JSON.parse(localStorage.getItem("hr_ui2")||"{}");["tab","msub","gview","pview"].forEach(k=>{if(s[k])ui[k]=s[k]})}catch(e){}
function saveUi(){try{localStorage.setItem("hr_ui2",JSON.stringify({tab:ui.tab,msub:ui.msub,gview:ui.gview,pview:ui.pview}))}catch(e){}}

/* ---------- storage ---------- */
let db=null,base=null,mode="local";
const LKEY="haru-budget-standalone-v1";
const chains={};const dirty=new Set();let flushT=null;
function monthObj(m){if(!state.months[m])state.months[m]={budgets:{},tx:[]};return state.months[m]}
function markDirty(key){dirty.add(key);clearTimeout(flushT);flushT=setTimeout(flush,500)}
function metaBody(){return{categories:state.categories,example:state.example,seeded:true,projSeeded:state.projSeeded,projOrder:state.projects.map(p=>p.id)}}
function flush(){
  if(mode==="local"){try{localStorage.setItem(LKEY,JSON.stringify(state))}catch(e){}dirty.clear();setStatus("저장됨");return}
  for(const key of [...dirty]){
    dirty.delete(key);
    const ref=db.doc(base+"/"+key);let op;
    if(key==="meta"){const b=JSON.parse(JSON.stringify(metaBody()));op=()=>ref.set(b)}
    else if(key.startsWith("m-")){const b=JSON.parse(JSON.stringify(state.months[key.slice(2)]||{budgets:{},tx:[]}));op=()=>ref.set(b)}
    else{const p=state.projects.find(x=>"p-"+x.id===key);if(p){const b=JSON.parse(JSON.stringify(p));op=()=>ref.set(b)}else op=()=>ref.delete()}
    chains[key]=(chains[key]||Promise.resolve()).then(op).then(()=>setStatus("저장됨")).catch(e=>{setStatus("저장 실패 · 잠시 후 다시 시도해 주세요");console.warn(e)});
  }
}
const saveMeta=()=>markDirty("meta"),saveMonth=m=>markDirty("m-"+m),saveProj=id=>markDirty("p-"+id);
function setStatus(t){const el=document.getElementById("status");if(el)el.textContent=storageOK?"이 기기 브라우저에 저장 · "+t:"이 브라우저에서는 저장이 안 돼요. 백업 파일을 꼭 저장해 주세요"}

/* ---------- seeds ---------- */
function seedMonth(){
  const cats=[
    {id:"c_food",name:"식비",color:PALETTE[0],fixed:false},{id:"c_cafe",name:"카페·간식",color:PALETTE[1],fixed:false},
    {id:"c_move",name:"교통",color:PALETTE[2],fixed:false},{id:"c_life",name:"생활·쇼핑",color:PALETTE[3],fixed:false},
    {id:"c_fun",name:"문화·여가",color:PALETTE[4],fixed:false},{id:"c_fix",name:"통신·구독",color:PALETTE[5],fixed:true}];
  const budgets={c_food:450000,c_cafe:80000,c_move:100000,c_life:150000,c_fun:100000,c_fix:85000};
  const today=Number(todayKey.slice(8));const tx=[];let r=7;const rnd=()=>{r=(r*9301+49297)%233280;return r/233280};
  const memos={c_food:["점심 김치찌개","편의점 도시락","저녁 장보기","배달 치킨","점심 국밥"],c_cafe:["아메리카노","빵집","라떼"],c_move:["교통카드 충전","택시"],c_life:["생필품","다이소"],c_fun:["영화","전시회"]};
  const amt={c_food:[7000,16000],c_cafe:[3500,7500],c_move:[10000,25000],c_life:[6000,30000],c_fun:[12000,28000]};
  for(let d=1;d<=today;d++){const date=`${curMonth}-${pad(d)}`;
    if(d===2)tx.push({id:uid(),date,amount:55000,cat:"c_fix",memo:"휴대폰 요금"});
    if(d===5)tx.push({id:uid(),date,amount:17000,cat:"c_fix",memo:"음악·영상 구독"});
    const keys=["c_food"];if(rnd()<.35)keys.push("c_food");if(rnd()<.5)keys.push("c_cafe");if(rnd()<.25)keys.push("c_move");if(rnd()<.15)keys.push("c_life");if(rnd()<.1)keys.push("c_fun");
    for(const k of keys){if(d===today&&k!=="c_food")continue;if(rnd()<.2&&k!=="c_food")continue;const[a,b]=amt[k];const v=Math.round((a+rnd()*(b-a))/100)*100;const ms=memos[k];tx.push({id:uid(),date,amount:v,cat:k,memo:ms[Math.floor(rnd()*ms.length)]});if(d===today)break}}
  state.categories=cats;state.months={[curMonth]:{budgets,tx}};state.example=true;
}
function seedProjects(){
  const mk=(name,icon,grad,date,items,txs)=>{const its=items.map(([n,b])=>({id:"i_"+uid(),name:n,budget:b}));
    return{id:"p_"+uid(),name,icon,grad,date,example:true,items:its,tx:txs.map(([i,d,a,m])=>({id:uid(),itemId:its[i].id,date:d,amount:a,memo:m}))}};
  state.projects=[
    mk("우리 아기 돌잔치","cake","coral","2026-11-14",[["장소 대관·식대",2500000],["스냅 촬영",800000],["한복·의상",500000],["돌상·장식",700000],["답례품",600000]],
      [[0,"2026-08-20",500000,"대관 계약금"],[1,"2026-09-03",200000,"스냅 예약금"],[2,"2026-09-15",350000,"아기 한복 대여"],[4,"2026-09-20",45000,"답례품 샘플"],[3,"2026-09-22",180000,"돌상 소품"]]),
    mk("내 집 마련","house","sky","2027-03-31",[["계약금",50000000],["중도금",150000000],["중개 수수료",2400000],["취득세",5500000],["인테리어",20000000],["이사",1500000]],
      [[0,"2026-09-12",50000000,"매매 계약금"],[5,"2026-09-18",100000,"이사 견적 예약"],[4,"2026-09-21",300000,"인테리어 실측·상담"]]),
    mk("제주 가족여행","plane","teal","2026-10-17",[["항공권",600000],["숙소",900000],["렌터카",250000],["식비·카페",600000],["체험·입장료",200000]],
      [[0,"2026-09-01",580000,"왕복 항공 4인"],[1,"2026-09-08",720000,"독채 펜션 3박"],[2,"2026-09-18",210000,"SUV 3일"]])
  ];
  state.projSeeded=true;
}
function migrateColors(){let ch=false;state.categories.forEach((c,i)=>{if(OLD_PALETTE.includes(c.color)){c.color=PALETTE[i%PALETTE.length];ch=true}});return ch}
function normalize(){if(!state.projects)state.projects=[];if(!state.months)state.months={};if(!state.categories)state.categories=[]}

let storageOK=true;
function init(){
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){storageOK=false}
  try{const raw=localStorage.getItem(LKEY);if(raw)state={...state,...JSON.parse(raw)}}catch(e){}
  normalize();
  if(!state.categories.length)seedMonth();
  if(!state.projSeeded)seedProjects();
  migrateColors();
  try{localStorage.setItem(LKEY,JSON.stringify(state))}catch(e){}
  render();setStatus(storageOK?"준비됨":"저장 불가");
}
function lastBackup(){try{return localStorage.getItem("hr_lastbackup")}catch(e){return null}}
function exportData(){
  const data=JSON.stringify({app:"haru-budget",version:1,exportedAt:new Date().toISOString(),state},null,1);
  const blob=new Blob([data],{type:"application/json"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`하루예산_백업_${todayKey}.json`;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{localStorage.setItem("hr_lastbackup",todayKey)}catch(e){}
  toast("백업 파일을 저장했어요");if(sheet&&sheet.kind==="backup")drawSheet();
}
function importData(file){
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);const st=j.state||j;if(!st||!Array.isArray(st.categories))throw 0;
      state={categories:[],months:{},example:false,projects:[],projSeeded:true,...st};normalize();
      try{localStorage.setItem(LKEY,JSON.stringify(state))}catch(e){}
      sheet=null;drawSheet();ui.proj=null;render();toast("백업을 불러왔어요")}
    catch(e){toast("하루예산 백업 파일이 아니에요")}};
  r.readAsText(file);
}
/* ---------- calc ---------- */
function calc(m){
  const mo=monthObj(m);const days=daysIn(m);
  const catById=Object.fromEntries(state.categories.map(c=>[c.id,c]));
  const budgetOf=id=>Number(mo.budgets[id]||0);
  const totalVar=state.categories.filter(c=>!c.fixed).reduce((s,c)=>s+budgetOf(c.id),0);
  const totalFix=state.categories.filter(c=>c.fixed).reduce((s,c)=>s+budgetOf(c.id),0);
  const isCur=m===curMonth,isPast=m<curMonth;
  const tday=isCur?Number(todayKey.slice(8)):(isPast?days+1:1);
  const daysLeft=Math.max(1,days-tday+1);
  const per={};state.categories.forEach(c=>per[c.id]={spent:0,before:0,today:0});
  let spentVar=0,spentFix=0,beforeVar=0,todayVar=0;const byDay={};
  mo.tx.forEach(t=>{const c=catById[t.cat];if(!c)return;const p=per[t.cat];const a=Number(t.amount)||0;p.spent+=a;const d=Number(t.date.slice(8));
    if(isCur&&t.date<todayKey)p.before+=a;if(t.date===todayKey)p.today+=a;
    if(c.fixed)spentFix+=a;else{spentVar+=a;byDay[d]=(byDay[d]||0)+a;if(isCur&&t.date<todayKey)beforeVar+=a;if(t.date===todayKey)todayVar+=a}});
  const daily=isPast?0:(totalVar-beforeVar)/daysLeft;
  return{mo,days,totalVar,totalFix,spentVar,spentFix,beforeVar,todayVar,daily,daysLeft,isCur,isPast,per,byDay,avgDaily:totalVar/days,catById,budgetOf};
}
function pcalc(p){
  const per={};p.items.forEach(i=>per[i.id]=0);let spent=0;
  p.tx.forEach(t=>{const a=Number(t.amount)||0;spent+=a;if(per[t.itemId]!==undefined)per[t.itemId]+=a});
  const budget=p.items.reduce((s,i)=>s+Number(i.budget||0),0);
  return{budget,spent,left:budget-spent,pct:budget?spent/budget*100:0,per};
}
const itemColor=(p,id)=>PALETTE[Math.max(0,p.items.findIndex(i=>i.id===id))%PALETTE.length];

/* ---------- shared pieces ---------- */
function statusPill(spent,budget,elapsed){
  if(!budget)return `<span class="pill warn">예산 없음</span>`;
  if(spent>budget)return `<span class="pill over">${won(spent-budget)}원 초과</span>`;
  if(elapsed!=null&&spent/budget>elapsed+0.1)return `<span class="pill warn">빠른 속도</span>`;
  if(elapsed==null&&spent/budget>=.9)return `<span class="pill warn">거의 다 씀</span>`;
  if(elapsed==null&&spent>=budget&&budget)return `<span class="pill ok">완료</span>`;
  return `<span class="pill ok">여유</span>`;
}
const wave=`<svg class="wave" viewBox="0 0 400 140" preserveAspectRatio="none" aria-hidden="true"><path d="M0 80 C60 40 110 110 180 70 S300 20 400 60 V140 H0Z" fill="#fff"/><path d="M0 110 C80 80 140 130 220 100 S340 70 400 95 V140 H0Z" fill="#fff" opacity=".6"/></svg>`;
function arcPath(cx,cy,r,ri,a0,a1){
  const p=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)];if(a1-a0>=Math.PI*2-1e-6)a1=a0+Math.PI*2-1e-4;
  const L=a1-a0>Math.PI?1:0;const[x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
  return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${L} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${ri},${ri} 0 ${L} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`;
}
/* rows: [{id,name,color,v}] */
function donut(ns,rows,centerLabel){
  rows=rows.filter(r=>r.v>0);const total=rows.reduce((s,r)=>s+r.v,0);
  if(!total)return `<div class="empty">아직 기록한 지출이 없어요</div>`;
  const sel=rows.find(r=>r.id===ui.sel[ns])?ui.sel[ns]:null;let a=0;const C=90,R=80,RI=52;
  const slices=rows.map(r=>{const a0=a,a1=a+r.v/total*Math.PI*2;a=a1;const on=sel===r.id;const pc=(r.v/total*100).toFixed(1);
    return `<path d="${arcPath(C,C,on?R+5:R,RI,a0,a1)}" fill="${r.color}" stroke="var(--solid)" stroke-width="2" stroke-linejoin="round" opacity="${sel&&!on?0.3:1}" data-a="sel" data-ns="${ns}" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)} ${won(r.v)}원 ${pc}%"><title>${esc(r.name)} ${won(r.v)}원 (${pc}%)</title></path>`}).join("");
  const sr=sel&&rows.find(r=>r.id===sel);
  const center=sr?`<text x="${C}" y="${C-8}" text-anchor="middle" class="pc1">${esc(sr.name.length>7?sr.name.slice(0,7)+"…":sr.name)}</text><text x="${C}" y="${C+14}" text-anchor="middle" class="pc2">${(sr.v/total*100).toFixed(1)}%</text><text x="${C}" y="${C+30}" text-anchor="middle" class="pc3">${short(sr.v)}원</text>`
    :`<text x="${C}" y="${C-6}" text-anchor="middle" class="pc1">${centerLabel}</text><text x="${C}" y="${C+16}" text-anchor="middle" class="pc2">${short(total)}</text><text x="${C}" y="${C+32}" text-anchor="middle" class="pc3">원</text>`;

function readTx(){const a=document.getElementById("s_amt");if(!a)return;sheet.amount=moneyVal(a.value);sheet.memo=document.getElementById("s_memo").value;sheet.date=document.getElementById("s_date").value||sheet.date}
function readProj(){const n=document.getElementById("pj_name");if(!n)return;sheet.name=n.value;sheet.date=document.getElementById("pj_date").value;
  sheet.items.forEach((it,i)=>{it.name=document.getElementById("pi_n_"+i).value;it.budget=moneyVal(document.getElementById("pi_b_"+i).value)})}
function removeTxEverywhere(id){
  for(const m of Object.keys(state.months)){const i=state.months[m].tx.findIndex(t=>t.id===id);if(i>-1){state.months[m].tx.splice(i,1);saveMonth(m)}}
  for(const p of state.projects){const i=p.tx.findIndex(t=>t.id===id);if(i>-1){p.tx.splice(i,1);saveProj(p.id)}}
}
function commitTx(){
  readTx();const s=sheet;if(!s.amount)return toast("금액을 입력해 주세요");
  removeTxEverywhere(s.id);
  if(s.target==="month"){
    if(!s.cat)return toast("카테고리를 먼저 만들어 주세요");
    const m=s.date.slice(0,7);const mo=monthObj(m);mo.tx.push({id:s.id,date:s.date,amount:s.amount,cat:s.cat,memo:s.memo.trim()});
    if(!Object.keys(mo.budgets).length){const pr=state.months[shiftMonth(m,-1)];if(pr)mo.budgets={...pr.budgets}}
    saveMonth(m);try{localStorage.setItem("hr_lastcat",s.cat)}catch(e){}
  }else{
    const p=state.projects.find(x=>x.id===s.pid);if(!p)return toast("목표를 골라 주세요");if(!s.item)return toast("세부 항목을 골라 주세요");
    p.tx.push({id:s.id,itemId:s.item,date:s.date,amount:s.amount,memo:s.memo.trim()});saveProj(p.id);
  }
  const msg=s.edit?"수정했어요":`${won(s.amount)}원 기록했어요`;sheet=null;drawSheet();render();toast(msg);
}
function commitProj(){
  readProj();const s=sheet;const name=s.name.trim();if(!name)return toast("목표 이름을 입력해 주세요");
  const items=s.items.filter(i=>i.name.trim()||i.budget).map(i=>({id:i.id,name:i.name.trim()||"이름 없는 항목",budget:i.budget}));
  let p=state.projects.find(x=>x.id===s.id);
  if(p){Object.assign(p,{name,icon:s.icon,grad:s.grad,date:s.date,items});const ids=new Set(items.map(i=>i.id));p.tx.forEach(t=>{if(!ids.has(t.itemId)&&items[0])t.itemId=items[0].id})}
  else{p={id:s.id,name,icon:s.icon,grad:s.grad,date:s.date,items,tx:[]};state.projects.push(p);saveMeta()}
  saveProj(p.id);const isNew=s.isNew;sheet=null;drawSheet();ui.tab="goals";ui.proj=p.id;ui.pview="items";render();window.scrollTo({top:0});toast(isNew?"목표를 만들었어요":"저장했어요");

document.addEventListener("click",e=>{

  if(a==="s-close"&&el.classList.contains("scrim")&&e.target!==el)return;
  switch(a){
    case "tab":ui.tab=d.t;if(d.t==="goals")ui.proj=null;saveUi();render();window.scrollTo({top:0});break;
    case "go":ui.tab=d.t;if(d.sub)ui.msub=d.sub;ui.proj=null;saveUi();render();window.scrollTo({top:0});break;
    case "m-prev":ui.month=shiftMonth(ui.month,-1);render();break;
    case "m-next":ui.month=shiftMonth(ui.month,1);render();break;
    case "msub":ui.msub=d.v;ui.confirmDel=null;saveUi();render();break;
    case "gview":ui.gview=d.v;saveUi();render();break;
    case "pview":ui.pview=d.v;saveUi();render();break;
    case "open-proj":ui.tab="goals";ui.proj=d.id;ui.openItem=null;render();window.scrollTo({top:0});break;
    case "back":ui.proj=null;render();window.scrollTo({top:0});break;
    case "item":ui.openItem=ui.openItem===d.id?null:d.id;render();break;
    case "sel":ui.sel[d.ns]=ui.sel[d.ns]===d.id?null:d.id;render();break;
    case "pie-mode":ui.pieMode=d.v;ui.sel.cat=null;render();break;
    case "goto-cat":ui.tab="month";ui.msub="list";ui.filter=d.id;saveUi();render();window.scrollTo({top:0});break;
    case "filter":ui.filter=d.id;render();break;
    case "clear-ex":for(const m of Object.keys(state.months)){state.months[m].tx=[];saveMonth(m)}state.example=false;saveMeta();render();toast("예시 내역을 지웠어요");break;
    case "clear-exp":{const ex=state.projects.filter(p=>p.example).map(p=>p.id);state.projects=state.projects.filter(p=>!p.example);ex.forEach(saveProj);saveMeta();ui.proj=null;render();toast("예시 목표를 지웠어요");break}
    case "add-tx":openTx({pid:d.pid,item:d.item});break;
    case "tx-edit":{let t;if(d.src==="m"){for(const m of Object.keys(state.months)){t=state.months[m].tx.find(x=>x.id===d.id);if(t)break}if(t)openTx({edit:true,target:"month",id:t.id,cat:t.cat,amount:t.amount,memo:t.memo,date:t.date,pid:state.projects[0]?.id||"",item:""})}
      else{const p=state.projects.find(x=>x.id===d.pid);t=p&&p.tx.find(x=>x.id===d.id);if(t)openTx({edit:true,target:"goal",id:t.id,pid:p.id,item:t.itemId,amount:t.amount,memo:t.memo,date:t.date,cat:state.categories[0]?.id||""})}break}
    case "new-proj":openProj(null);break;
    case "backup":sheet={kind:"backup",confirm:false};drawSheet();break;
    case "bk-export":exportData();break;
    case "bk-reset":sheet.confirm=true;drawSheet();break;
    case "bk-resetno":sheet.confirm=false;drawSheet();break;
    case "bk-resetyes":state={categories:[],months:{},example:false,projects:[],projSeeded:true};
      state.categories=[{id:"c_food",name:"식비",color:PALETTE[0],fixed:false},{id:"c_cafe",name:"카페·간식",color:PALETTE[1],fixed:false},{id:"c_move",name:"교통",color:PALETTE[2],fixed:false},{id:"c_life",name:"생활·쇼핑",color:PALETTE[3],fixed:false},{id:"c_fix",name:"고정비",color:PALETTE[5],fixed:true}];
      try{localStorage.setItem(LKEY,JSON.stringify(state))}catch(e){}sheet=null;drawSheet();ui.proj=null;ui.tab="month";ui.msub="set";render();toast("초기화했어요. 예산부터 정해 보세요");break;
    case "edit-proj":openProj(state.projects.find(x=>x.id===d.id));break;
    /* category settings */
    case "c-color":case "c-del":case "c-delno":case "c-delyes":{const id=el.closest(".ce").dataset.cat;const c=state.categories.find(x=>x.id===id);
      if(a==="c-color"){const i=PALETTE.indexOf(c.color);c.color=PALETTE[(i+1)%PALETTE.length];saveMeta()}
      if(a==="c-del")ui.confirmDel=id;if(a==="c-delno")ui.confirmDel=null;
      if(a==="c-delyes"){state.categories=state.categories.filter(x=>x.id!==id);ui.confirmDel=null;saveMeta();toast("카테고리를 삭제했어요")}
      render();break}
    case "c-add":{const used=new Set(state.categories.map(c=>c.color));const col=PALETTE.find(p=>!used.has(p))||PALETTE[state.categories.length%PALETTE.length];const c={id:"c_"+uid(),name:"새 카테고리",color:col,fixed:false};state.categories.push(c);saveMeta();render();setTimeout(()=>{const i=document.getElementById("n_"+c.id);i&&(i.focus(),i.select())},30);break}
    case "c-copy":monthObj(ui.month).budgets={...state.months[shiftMonth(ui.month,-1)].budgets};saveMonth(ui.month);render();toast("지난달 예산을 불러왔어요");break;
    /* tx sheet */
    case "s-close":sheet=null;drawSheet();break;
    case "s-tgt":readTx();sheet.target=d.v;if(d.v==="goal"&&!state.projects.find(p=>p.id===sheet.pid))sheet.pid=state.projects[0]?.id||"";drawSheet();break;
    case "s-q":readTx();sheet.amount=d.v==="0"?0:sheet.amount+Number(d.v);drawSheet();break;
    case "s-cat":readTx();sheet.cat=d.id;drawSheet();break;
    case "s-proj":{readTx();sheet.pid=d.id;const p=state.projects.find(x=>x.id===d.id);sheet.item=p?.items[0]?.id||"";drawSheet();break}
    case "s-item":readTx();sheet.item=d.id;drawSheet();break;
    case "s-del":readTx();sheet.confirm=true;drawSheet();break;
    case "s-delno":sheet.confirm=false;drawSheet();break;
    case "s-delyes":removeTxEverywhere(sheet.id);sheet=null;drawSheet();render();toast("삭제했어요");break;
    /* project sheet */
    case "pj-icon":readProj();sheet.icon=d.v;drawSheet();break;
    case "pj-grad":readProj();sheet.grad=d.v;drawSheet();break;
    case "pj-add":readProj();sheet.items.push({id:"i_"+uid(),name:"",budget:0});drawSheet();setTimeout(()=>document.getElementById("pi_n_"+(sheet.items.length-1))?.focus(),30);break;
    case "pj-rm":readProj();sheet.items.splice(Number(d.idx),1);drawSheet();break;
    case "pj-del":readProj();sheet.confirm=true;drawSheet();break;
    case "pj-delno":sheet.confirm=false;drawSheet();break;
    case "pj-delyes":{const id=sheet.id;state.projects=state.projects.filter(p=>p.id!==id);saveProj(id);saveMeta();sheet=null;drawSheet();ui.proj=null;render();toast("목표를 삭제했어요");break}
  }
});
document.addEventListener("submit",e=>{e.preventDefault();if(e.target.id==="sheetForm")commitTx();if(e.target.id==="projForm")commitProj()});
document.addEventListener("input",e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute("data-money")){const n=moneyVal(t.value);t.value=n?won(n):""}});
document.addEventListener("change",e=>{
  const t=e.target;if(t.id==="bk_file"&&t.files&&t.files[0]){importData(t.files[0]);return}if(t.hasAttribute("data-money")&&t.id.startsWith("pi_b_")&&sheet){readProj();const tot=document.querySelector("#projForm .totalrow b");if(tot)tot.textContent=won(sheet.items.reduce((a,i)=>a+Number(i.budget||0),0))+"원";return}
  const row=t.closest(".ce");if(!row)return;const id=row.dataset.cat;const c=state.categories.find(x=>x.id===id);
  if(t.dataset.act==="name"){c.name=t.value.trim()||"이름 없음";saveMeta();keepFocus()}
  if(t.dataset.act==="budget"){monthObj(ui.month).budgets[id]=moneyVal(t.value);saveMonth(ui.month);keepFocus()}
  if(t.dataset.act==="fixed"){c.fixed=t.checked;saveMeta();keepFocus()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&sheet){sheet=null;drawSheet();return}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("path[data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
window.addEventListener("pagehide",()=>{clearTimeout(flushT);if(dirty.size)flush()});
init();
})();
</script>

</body>
</html>
