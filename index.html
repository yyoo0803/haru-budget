<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111413" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루예산">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<title>하루예산</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme:light;
  --bg:#FFFFFF; --card:#FFFFFF; --soft:#F3F5F4; --soft2:#E9EDEB; --line:#EDF0EE;
  --ink:#17191C; --ink2:#5E656E; --ink3:#9AA1A9;
  --green:#2D8A6B; --green-ink:#FFFFFF; --green-soft:#E9F4EF; --green-text:#237457;
  --bad:#E5484D; --bad-soft:#FDECEC; --warn:#C27A00; --warn-soft:#FFF4DE;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111413; --card:#181C1A; --soft:#1F2422; --soft2:#29302D; --line:#232826;
  --ink:#EEF2F0; --ink2:#A9B2AE; --ink3:#6F7974;
  --green:#3DB48A; --green-ink:#0B1411; --green-soft:#16302A; --green-text:#5FD0A5;
  --bad:#FF6B6F; --bad-soft:#3A1D1F; --warn:#F2B33D; --warn-soft:#352B14;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111413; --card:#181C1A; --soft:#1F2422; --soft2:#29302D; --line:#232826;
  --ink:#EEF2F0; --ink2:#A9B2AE; --ink3:#6F7974;
  --green:#3DB48A; --green-ink:#0B1411; --green-soft:#16302A; --green-text:#5FD0A5;
  --bad:#FF6B6F; --bad-soft:#3A1D1F; --warn:#F2B33D; --warn-soft:#352B14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;letter-spacing:-.2px;padding-inline:22px;padding-block:calc(env(safe-area-inset-top,0px) + 6px) calc(150px + env(safe-area-inset-bottom,0px));min-height:100%;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.app{max-width:480px;margin:0 auto}
.screen{display:flex;flex-direction:column}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* header */
.head{display:flex;align-items:center;gap:6px;padding-block:16px 10px}
.head h1{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:0;flex:1}
.head .ctr{flex:1;text-align:center;font-size:17px;font-weight:700}
.ibtn{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.ibtn:active{background:var(--soft)}
.ibtn .ic{width:24px;height:24px}
/* summary */
.sum{padding-block:12px 20px}
.sum .lbl{font-size:16px;font-weight:700;color:var(--ink)}
.sum .big{font-size:40px;font-weight:800;letter-spacing:-1.4px;line-height:1.15;margin-top:6px}
.sum .big small{font-size:30px;font-weight:800;letter-spacing:-1px}
.sum .sub{font-size:14px;color:var(--ink2);margin-top:14px}
.track{height:12px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-top:8px}
.track i{display:block;height:100%;border-radius:99px;background:var(--green)}
.sum .hint{font-size:14px;color:var(--ink2);margin-top:10px}
.sum .hint.over{color:var(--bad)}
.split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:16px}
.split>div{padding-inline:2px}
.split>div+div{border-left:1px solid var(--line);padding-left:22px}
.split span{font-size:14px;color:var(--ink2)}
.split b{display:block;font-size:22px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.split b.g{color:var(--green-text)}
/* section */
.sec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:24px 8px}
.sec h2{font-size:18px;margin:0;font-weight:800;letter-spacing:-.4px}
.more{border:0;background:none;color:var(--ink2);font-size:14px;display:flex;align-items:center;gap:2px;padding:4px 0}
.more .ic{width:16px;height:16px}
.aside{font-size:13px;color:var(--ink3)}
.day{font-size:14px;color:var(--ink2);padding-block:14px 2px;display:flex;justify-content:space-between}
.day .num{color:var(--ink3)}
/* rows */
.row{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding-block:13px;border:0;background:none;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.circ{width:46px;height:46px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--ink2);flex:none}
.circ .ic{width:22px;height:22px}
.row .t1{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:13px;color:var(--ink3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .a{font-size:16px;font-weight:700;text-align:right;white-space:nowrap}
.row .a small{display:block;font-size:12px;font-weight:500;color:var(--ink3)}
.row .mini{height:5px;border-radius:99px;background:var(--soft2);overflow:hidden;margin-top:8px}
.row .mini i{display:block;height:100%;border-radius:99px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--ink2);white-space:nowrap;margin-left:6px;vertical-align:2px}
.tag.ex{background:var(--warn-soft);color:var(--warn)}
.tag.g{background:var(--green-soft);color:var(--green-text)}
.pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:6px;white-space:nowrap;margin-left:6px;vertical-align:2px}
.pill.ok{background:var(--green-soft);color:var(--green-text)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.over{background:var(--bad-soft);color:var(--bad)}
.empty{color:var(--ink3);font-size:14px;text-align:center;padding:30px 0}
/* goal cards */
.ggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:6px}
.gcard{border:0;text-align:left;background:var(--soft);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:172px;justify-content:space-between;width:100%}
.gcard .circ{background:var(--card);width:42px;height:42px}
.gcard .top{display:flex;justify-content:space-between;align-items:flex-start}
.gcard .name{font-weight:700;font-size:15px;line-height:1.35}
.gcard .meta{font-size:12px;color:var(--ink3);margin-top:2px}
.gcard .pct{font-size:26px;font-weight:800;letter-spacing:-.8px;line-height:1;margin-bottom:8px}
.gcard .mini{height:6px;border-radius:99px;background:var(--card);overflow:hidden}
.gcard .mini i{display:block;height:100%;border-radius:99px}
.gadd{border:1.5px dashed var(--soft2);background:none;border-radius:20px;min-height:172px;display:grid;place-items:center;align-content:center;gap:6px;color:var(--ink3);font-weight:600;font-size:14px}
/* seg (template: green filled active) */
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:11px;padding:10px 8px;font-size:15px;color:var(--ink2);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--green-ink);font-weight:700}
.seg.sm button{padding:6px 12px;font-size:13px}
.vtoggle{display:flex;gap:2px}
.vtoggle button{border:0;background:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink3)}
.vtoggle button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
.vtoggle .ic{width:19px;height:19px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:12px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;flex:none;color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--green-soft);color:var(--green-text);border-color:transparent}
.chip .ic{width:15px;height:15px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--ink2);margin-top:6px}
.banner button{border:0;background:var(--card);color:var(--ink);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.hlbox{background:var(--green-soft);border-radius:16px;padding:18px 20px;margin-top:14px}
.hlbox span{font-size:14px;color:var(--ink2)}
.hlbox b{display:block;font-size:24px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.kgrid{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);padding-block:16px}
.kgrid>div+div{border-left:1px solid var(--line);padding-left:14px}
.kgrid span{font-size:13px;color:var(--ink2)}
.kgrid b{display:block;font-size:17px;font-weight:800;margin-top:2px}
/* item accordion */
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>button{display:grid;grid-template-columns:auto 1fr auto auto;gap:6px 12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding-block:15px}
.item .n{font-weight:600;font-size:16px;min-width:0}
.item .a{font-size:14px;font-weight:600;color:var(--ink2);text-align:right}
.item .mini{grid-column:1/-1;height:6px;border-radius:99px;background:var(--soft2);overflow:hidden}
.item .mini i{display:block;height:100%;border-radius:99px}
.item .chev{color:var(--ink3);transition:transform .2s;width:18px;height:18px}
.item.open .chev{transform:rotate(90deg)}
.item .sub{padding:0 0 14px 22px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.btn{border:0;background:var(--soft);border-radius:14px;padding:12px 16px;font-size:15px;font-weight:700;color:var(--ink)}
.btn.green{background:var(--green);color:var(--green-ink)}
.btn.wide{width:100%;padding:17px;font-size:16px}
.btn.del{background:var(--bad-soft);color:var(--bad)}
.half{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.half .btn{width:100%;padding:17px;font-size:16px}
/* charts */
.pie{display:grid;grid-template-columns:160px 1fr;gap:16px;align-items:center;padding-top:6px}
.pie svg{max-width:100%;height:auto;overflow:visible}
.pie path{cursor:pointer;transition:opacity .15s}
.pc1{font-size:12px;fill:var(--ink3);font-family:var(--font);font-weight:600}
.pc2{font-size:20px;fill:var(--ink);font-weight:800;font-family:var(--font)}
.pc3{font-size:11px;fill:var(--ink3);font-family:var(--font)}
.lgs{display:flex;flex-direction:column;gap:2px;min-width:0}
.lg{display:grid;grid-template-columns:auto 1fr auto 44px;gap:8px;align-items:center;border:0;background:none;text-align:left;padding:7px 8px;border-radius:10px;width:100%}
.lg:hover,.lg.on{background:var(--soft)}
.lg.dim{opacity:.45}
.lgn{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lgv{font-size:12px;color:var(--ink3);text-align:right}
.lgp{font-size:14px;font-weight:700;text-align:right}
.vbar{width:100%;height:auto;display:block;overflow:visible;margin-top:10px}
.vbar text{font-family:var(--font);fill:var(--ink3);font-size:10px}
.vbar .grid{stroke:var(--line);stroke-width:1}
.vbar rect.hit{fill:transparent;cursor:pointer}
.hbars{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.hb{display:grid;grid-template-columns:1fr auto;gap:6px 8px}
.hb .n{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.hb .v{font-size:13px;color:var(--ink2);font-weight:600}
.hb .mini{grid-column:1/-1;height:8px;border-radius:99px;background:var(--soft2);overflow:hidden}
.hb .mini i{display:block;height:100%;border-radius:99px}
.mnav{display:flex;align-items:center;justify-content:center;gap:18px;padding-block:6px}
.mnav button{border:0;background:none;color:var(--ink);width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.mnav button .ic{width:20px;height:20px}
.mnav span{font-weight:700;font-size:18px}
.divider{height:1px;background:var(--line);margin-block:6px}
/* FAB + nav */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--green);color:var(--green-ink);border:0;border-radius:99px;padding:14px 26px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 20px rgba(45,138,107,.35);z-index:9}
.fab .ic{width:20px;height:20px;stroke-width:2.2}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:10}
.nav .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--ink3);padding:4px 0}
.nav button[aria-current="page"]{color:var(--green)}
.nav .ic{width:26px;height:26px}
.nav button[aria-current="page"] .ic{fill:var(--green-soft)}
/* full page (record / editor) */
.page{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.page .ph{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:10px 12px;max-width:480px;width:100%;margin:0 auto}
.page .ph h3{margin:0;text-align:center;font-size:18px;font-weight:700}
.page .body{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 22px 20px;max-width:480px;width:100%;margin:0 auto}
.page .foot{padding:10px 22px calc(12px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;margin:0 auto}
.amt{text-align:center;padding-block:10px 16px}
.amt .l{font-size:14px;color:var(--ink2)}
.amt .v{font-size:44px;font-weight:800;letter-spacing:-1.6px;line-height:1.2;margin-top:4px;word-break:break-all}
.amt .v small{font-size:30px;font-weight:700;margin-left:4px}
.amt .v .caret{display:inline-block;width:2px;height:40px;background:var(--green);vertical-align:-6px;margin-left:4px;animation:blink 1s steps(1) infinite}
.amt .v.zero{color:var(--ink3)}
@keyframes blink{50%{opacity:0}}
.amt .k{font-size:13px;color:var(--green-text);font-weight:600;min-height:20px;margin-top:2px}
.quick{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.quick button{border:0;background:var(--soft);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.frow{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding-block:15px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left;position:relative;color:var(--ink)}
.frow:last-of-type{border-bottom:1px solid var(--line)}
.frow .ic{color:var(--ink2)}
.frow .l{font-size:16px}
.frow .v{font-size:15px;color:var(--ink2);text-align:right;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .chev{width:18px;height:18px;color:var(--ink3)}
.frow input[type=date]{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;-webkit-appearance:none;appearance:none}
.memo{display:flex;gap:10px;align-items:flex-start;background:var(--soft);border-radius:14px;padding:13px 14px;margin-top:14px}
.memo .ic{color:var(--ink3);margin-top:1px}
.memo textarea{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--ink);resize:none;min-height:24px;max-height:140px;padding:0;outline:none;line-height:1.5}
.memo textarea::placeholder{color:var(--ink3)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.pad button{border:0;border-radius:12px;height:54px;font-size:24px;font-weight:500;background:var(--soft);color:var(--ink);touch-action:manipulation}
.pad button:active{background:var(--soft2)}
.pad .ic{width:26px;height:26px;margin:auto}
/* pickers & sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.4);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:24px 24px 0 0;padding:18px 22px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88%;overflow:auto}
.sheet h3{margin:0;font-size:18px;font-weight:800}
.shead{display:flex;justify-content:space-between;align-items:center}
.opt{display:flex;align-items:center;gap:12px;padding:12px 4px;border:0;background:none;width:100%;text-align:left;font-size:16px;border-radius:12px}
.opt:active{background:var(--soft)}
.opt .chk{margin-left:auto;color:var(--green)}
.opt .circ{width:38px;height:38px}
/* editor form */
.field{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink2);font-weight:600;margin-top:18px}
input[type=text],.datebox,input[inputmode]{font:inherit;color:var(--ink);background:var(--soft);border:1.5px solid transparent;border-radius:14px;padding:13px 14px;width:100%;min-width:0;font-size:16px}
input:focus{border-color:var(--green);outline:none}
.datebox{position:relative;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.datebox.empty{color:var(--ink3)}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}
.pickgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pick{aspect-ratio:1;max-width:100%;border-radius:14px;border:2px solid transparent;background:var(--soft);display:grid;place-items:center;color:var(--ink2)}
.pick[aria-pressed="true"]{border-color:var(--green);color:var(--green);background:var(--green-soft)}
.cpick{aspect-ratio:1;max-width:100%;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 2px transparent}
.cpick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.irow{display:grid;grid-template-columns:1fr 136px auto;gap:6px;align-items:center}
.irow .x{border:0;background:none;width:32px;height:32px;border-radius:10px;color:var(--ink3);font-size:22px}
.totalrow{display:flex;justify-content:space-between;font-size:15px;color:var(--ink);padding-top:6px}
.totalrow b{font-weight:800}
.confirm{background:var(--bad-soft);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}
/* keypad for editor budgets */
.kpad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.08)}
.kpad .in{max-width:480px;margin:0 auto}
.kpad .kh{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:2px 6px 10px}
.kpad .kl{font-size:13px;color:var(--ink2)}
.kpad .kv{font-size:30px;font-weight:800;letter-spacing:-1px;line-height:1.15;word-break:break-all}
.kpad .kv small{font-size:20px;margin-left:2px}
.kpad .kk{font-size:13px;color:var(--green-text);font-weight:600;min-height:18px}
.kpad .kh button{border:0;background:var(--green);color:var(--green-ink);font-weight:700;font-size:15px;padding:11px 18px;border-radius:12px;flex:none}
.kpad .pad{margin-top:0}
body.kb .page .body{padding-bottom:400px}

(function(){

const gc=g=>GCOL[g]||GCOL.sky;
const P={
 cake:"M4 20h16M5 20v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7M5 15.5c1.5 1 3 1 4.5 0s3-1 4.5 0 3 1 4.5 0M12 11V8M12 5.8c.9-.8.9-1.9 0-2.8-.9.9-.9 2 0 2.8z",

P.tag="M3 12V4h8l10 10-8 8zM7.5 7.5h.01";

const GOAL_ICONS=["cake","house","ring","plane","car","gift","heart","baby","grad","paw","star","wallet"];
const ic=(n,cls)=>`<svg viewBox="0 0 24 24" class="ic${cls?" "+cls:""}" aria-hidden="true"><path d="${P[n]||P.star}"/></svg>`;
const WD=["일","월","화","수","목","금","토"];
const won=n=>Math.round(n).toLocaleString("ko-KR");
const short=n=>{n=Math.round(n);const a=Math.abs(n),s=n<0?"−":"";if(a>=1e8)return s+(a/1e8).toFixed(1).replace(/\.0$/,"")+"억";if(a>=1e4)return s+Math.round(a/1e4).toLocaleString("ko-KR")+"만";return s+a.toLocaleString("ko-KR")};
const pad=n=>String(n).padStart(2,"0");
const now=new Date();
const todayKey=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const yday=(()=>{const d=new Date(now);d.setDate(d.getDate()-1);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`})();
const curMonth=todayKey.slice(0,7);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysIn=m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()};
const shiftMonth=(m,d)=>{const[y,mm]=m.split("-").map(Number);const t=new Date(y,mm-1+d,1);return `${t.getFullYear()}-${pad(t.getMonth()+1)}`};
const mLabel=m=>`${m.slice(0,4)}년 ${Number(m.slice(5))}월`;
const moneyVal=v=>Number(String(v).replace(/[^\d]/g,""))||0;
const dday=d=>{if(!d)return "";const x=Math.round((new Date(d+"T00:00")-new Date(todayKey+"T00:00"))/864e5);return x>0?`D-${x}`:x===0?"D-DAY":`D+${-x}`};
const md=d=>{const t=new Date(d+"T00:00");return `${t.getMonth()+1}월 ${t.getDate()}일`};
const fmtDate=d=>{const t=new Date(d+"T00:00");return `${md(d)} ${WD[t.getDay()]}요일`};
const dayHead=d=>d===todayKey?`오늘 · ${md(d)}`:d===yday?`어제 · ${md(d)}`:fmtDate(d);
function korMoney(n){if(!n)return "";const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4),r=n%1e4;const out=[];if(e)out.push(e.toLocaleString("ko-KR")+"억");if(m)out.push(m.toLocaleString("ko-KR")+"만");if(r)out.push(r.toLocaleString("ko-KR"));return out.join(" ")+"원"}
const padKeys=()=>["1","2","3","4","5","6","7","8","9","000","0","back"].map(k=>`<button type="button" data-k="${k}" ${k==="back"?'aria-label="지우기"':""}>${k==="back"?ic("del"):k}</button>`).join("");

/* ---------- state ---------- */
const LKEY="haru-budget-standalone-v1";
let state={categories:[],months:{},example:false,projects:[],projSeeded:false};
let ui={tab:"goals",gview:"list",proj:null,pview:"items",openItem:null,sel:{},stat:"all",statGoal:"all",statMonth:null};
try{const s=JSON.parse(localStorage.getItem("hr_ui4")||"{}");["tab","gview","pview","stat"].forEach(k=>{if(s[k])ui[k]=s[k]})}catch(e){}
function saveUi(){try{localStorage.setItem("hr_ui4",JSON.stringify({tab:ui.tab,gview:ui.gview,pview:ui.pview,stat:ui.stat}))}catch(e){}}
let storageOK=true,saveT=null;
function persist(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LKEY,JSON.stringify(state));setStatus("저장됨")}catch(e){setStatus("저장 실패")}},250)}
function setStatus(t){const el=document.getElementById("status");if(el)el.textContent=storageOK?"이 기기에 저장 · "+t:"이 브라우저에서는 기록이 저장되지 않아요"}

function seedProjects(){
  const mk=(name,icon,grad,date,items,txs)=>{const its=items.map(([n,b])=>({id:"i_"+uid(),name:n,budget:b}));
    return{id:"p_"+uid(),name,icon,grad,date,example:true,items:its,tx:txs.map(([i,d,a,m])=>({id:uid(),itemId:its[i].id,date:d,amount:a,memo:m}))}};
  state.projects=[
    mk("우리 아기 돌잔치","cake","coral","2026-11-14",[["장소 대관·식대",2500000],["스냅 촬영",800000],["한복·의상",500000],["돌상·장식",700000],["답례품",600000]],
      [[0,"2026-08-20",500000,"대관 계약금"],[1,"2026-09-03",200000,"스냅 예약금"],[2,"2026-09-15",350000,"아기 한복 대여"],[4,"2026-09-20",45000,"답례품 샘플"],[3,"2026-09-22",180000,"돌상 소품"]]),
    mk("내 집 마련","house","sky","2027-03-31",[["계약금",50000000],["중도금",150000000],["중개 수수료",2400000],["취득세",5500000],["인테리어",20000000],["이사",1500000]],
      [[0,"2026-09-12",50000000,"매매 계약금"],[5,"2026-09-18",100000,"이사 견적 예약"],[4,"2026-09-21",300000,"인테리어 실측·상담"]]),
    mk("제주 가족여행","plane","teal","2026-10-17",[["항공권",600000],["숙소",900000],["렌터카",250000],["식비·카페",600000],["체험·입장료",200000]],
      [[0,"2026-09-01",580000,"왕복 항공 4인"],[1,"2026-09-08",720000,"독채 펜션 3박"],[2,"2026-09-18",210000,"SUV 3일"]])
  ];
  state.projSeeded=true;
}

function init(){
  try{localStorage.setItem("__t","1");localStorage.removeItem("__t")}catch(e){storageOK=false}
  try{const raw=localStorage.getItem(LKEY);if(raw)state={...state,...JSON.parse(raw)}}catch(e){}
  if(!Array.isArray(state.projects))state.projects=[];
  if(!state.projSeeded)seedProjects();
  if(ui.tab!=="goals"&&ui.tab!=="stats")ui.tab="goals";
  persist();render();setStatus("준비됨");
}

/* ---------- calc ---------- */
function pcalc(p){
  const per={};p.items.forEach(i=>per[i.id]=0);let spent=0;
  p.tx.forEach(t=>{const a=Number(t.amount)||0;spent+=a;if(per[t.itemId]!==undefined)per[t.itemId]+=a});
  const budget=p.items.reduce((s,i)=>s+Number(i.budget||0),0);
  return{budget,spent,left:budget-spent,pct:budget?spent/budget*100:0,per};
}
const itemColor=(p,id)=>PALETTE[Math.max(0,p.items.findIndex(i=>i.id===id))%PALETTE.length];
function statusPill(s,b){if(!b)return "";if(s>b)return `<span class="pill over">${short(s-b)}원 초과</span>`;if(s===b)return `<span class="pill ok">완료</span>`;if(s/b>=.9)return `<span class="pill warn">거의 다 씀</span>`;return ""}

function arcPath(cx,cy,r,ri,a0,a1){
  const p=(a,rr)=>[cx+rr*Math.sin(a),cy-rr*Math.cos(a)];if(a1-a0>=Math.PI*2-1e-6)a1=a0+Math.PI*2-1e-4;
  const L=a1-a0>Math.PI?1:0;const[x0,y0]=p(a0,r),[x1,y1]=p(a1,r),[x2,y2]=p(a1,ri),[x3,y3]=p(a0,ri);
  return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r},${r} 0 ${L} 1 ${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${ri},${ri} 0 ${L} 0 ${x3.toFixed(2)},${y3.toFixed(2)}Z`;
}
function donut(ns,rows,label){
  rows=rows.filter(r=>r.v>0);const total=rows.reduce((s,r)=>s+r.v,0);
  if(!total)return `<div class="empty">이 기간에 기록한 지출이 없어요</div>`;
  const sel=rows.find(r=>r.id===ui.sel[ns])?ui.sel[ns]:null;let a=0;const C=90,R=80,RI=56;
  const slices=rows.map(r=>{const a0=a,a1=a+r.v/total*Math.PI*2;a=a1;const on=sel===r.id;const pc=(r.v/total*100).toFixed(1);
    return `<path d="${arcPath(C,C,on?R+4:R,RI,a0,a1)}" fill="${r.color}" stroke="var(--card)" stroke-width="2" stroke-linejoin="round" opacity="${sel&&!on?0.28:1}" data-a="sel" data-ns="${ns}" data-id="${r.id}" tabindex="0" role="button" aria-label="${esc(r.name)} ${won(r.v)}원 ${pc}%"><title>${esc(r.name)} ${won(r.v)}원 (${pc}%)</title></path>`}).join("");
  const sr=sel&&rows.find(r=>r.id===sel);
  const center=sr?`<text x="${C}" y="${C-8}" text-anchor="middle" class="pc1">${esc(sr.name.length>7?sr.name.slice(0,7)+"…":sr.name)}</text><text x="${C}" y="${C+15}" text-anchor="middle" class="pc2">${(sr.v/total*100).toFixed(1)}%</text><text x="${C}" y="${C+31}" text-anchor="middle" class="pc3">${short(sr.v)}원</text>`
    :`<text x="${C}" y="${C-6}" text-anchor="middle" class="pc1">${label}</text><text x="${C}" y="${C+17}" text-anchor="middle" class="pc2">${short(total)}</text><text x="${C}" y="${C+33}" text-anchor="middle" class="pc3">원</text>`;
  const legend=[...rows].sort((x,y)=>y.v-x.v).map(r=>{const on=sel===r.id;return `<button class="lg${on?" on":""}${sel&&!on?" dim":""}" data-a="sel" data-ns="${ns}" data-id="${r.id}"><span class="dot" style="background:${r.color}"></span><span class="lgn">${esc(r.name)}</span><span class="lgv num">${short(r.v)}원</span><span class="lgp num">${(r.v/total*100).toFixed(1)}%</span></button>`}).join("");
  return `<div class="pie"><svg viewBox="0 0 180 180" width="160" height="160" role="img" aria-label="${label} 비율">${slices}${center}</svg><div class="lgs">${legend}</div></div>`;
}
function niceStep(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
/* bars: [{key,label,v}] */
function vbars(ns,bars,labelEvery){
  const W=340,H=170,L=38,B=22,T=10,Rr=4;const pw=W-L-4,ph=H-B-T;
  const vmax=Math.max(...bars.map(b=>b.v),0);const step=niceStep(Math.max(vmax,1)/3);const nt=Math.max(1,Math.ceil(vmax/step));const mx=step*nt;const sel=ui.sel[ns];const si=bars.findIndex(b=>b.key===sel);
  const slot=pw/bars.length;const bw=Math.max(3,Math.min(26,slot*.62));
  let g="";for(let i=0;i<=nt;i++){const y=T+ph-ph*i/nt;g+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+3}" text-anchor="end">${i?short(step*i):"0"}</text>`}
  const bs=bars.map((b,i)=>{const x=L+slot*i+(slot-bw)/2;const h=b.v?Math.max(2,b.v/mx*ph):0;const y=T+ph-h;const on=sel===b.key;const r=Math.min(Rr,bw/2,h);
    const path=h?`<path d="M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${y+h}Z" fill="var(--green)" opacity="${sel&&!on?0.3:1}"/>`:"";
    const near=si>-1&&!on&&Math.abs(i-si)*slot<22;const lab=((i%labelEvery===0&&!near)||on)?`<text x="${x+bw/2}" y="${H-6}" text-anchor="middle" style="${on?"fill:var(--ink);font-weight:700":""}">${b.label}</text>`:"";
    return `${path}${lab}<rect class="hit" x="${L+slot*i}" y="${T}" width="${slot}" height="${ph+B}" data-a="sel" data-ns="${ns}" data-id="${b.key}" tabindex="0" role="button" aria-label="${b.aria||b.label} ${won(b.v)}원"><title>${b.aria||b.label} ${won(b.v)}원</title></rect>`}).join("");
  return `<svg class="vbar" viewBox="0 0 ${W} ${H}" role="img" aria-label="기간별 지출 막대 그래프">${g}${bs}</svg>`;
}



/* ---------- rows ---------- */
function txRow(p,t,showGoal){const it=p.items.find(i=>i.id===t.itemId);
  const title=(t.memo||"").split("\n")[0]||it?.name||"지출";
  return `<button class="row" data-a="tx-edit" data-pid="${p.id}" data-id="${t.id}"><span class="circ" style="color:${gc(p.grad)}">${ic(p.icon)}</span><div style="min-width:0"><div class="t1">${esc(title)}</div><div class="t2">${esc(showGoal?`${p.name} · ${it?.name||"항목 없음"}`:(it?.name||"항목 없음"))}</div></div><div class="a num">−${won(t.amount)}원</div></button>`}
function groupByDate(list,rowFn){const g={};list.forEach(t=>(g[t.t.date]=g[t.t.date]||[]).push(t));
  return Object.keys(g).sort().reverse().map(d=>`<div class="day"><span>${dayHead(d)}</span><span class="num">−${won(g[d].reduce((s,x)=>s+Number(x.t.amount),0))}원</span></div>`+g[d].map(rowFn).join("")).join("")}
function summary(label,B,S){
  const left=B-S,pct=B?Math.min(100,S/B*100):0;
  return `<section class="sum"><div class="lbl">${label}</div><div class="big num">${won(S)}<small>원</small></div>
  <div class="sub num">예산 ${won(B)}원</div><div class="track"><i style="width:${pct}%;${S>B?"background:var(--bad)":""}"></i></div>
  <div class="hint num${left<0?" over":""}">${left<0?`예산보다 ${won(-left)}원 더 썼어요`:`${won(left)}원 더 쓸 수 있어요`}</div></section>`;
}

/* ---------- screens ---------- */
function render(){
  const it=(t,icn,l)=>`<button data-a="tab" data-t="${t}" ${ui.tab===t?'aria-current="page"':""}>${ic(icn)}${l}</button>`;
  document.getElementById("nav").innerHTML=`<div class="in">${it("goals","target","목표 예산")}${it("stats","bars","통계")}</div>`;
  const s=document.getElementById("screen");
  let fab="";
  if(ui.tab==="goals"&&ui.proj&&state.projects.find(p=>p.id===ui.proj)){s.innerHTML=scrProject();fab=`<button class="fab" data-a="add-tx" data-pid="${ui.proj}">${ic("plus")}기록하기</button>`}
  else{if(ui.tab==="goals")ui.proj=null;s.innerHTML=ui.tab==="stats"?scrStats():scrGoals();if(ui.tab==="goals"&&state.projects.length)fab=`<button class="fab" data-a="add-tx">${ic("plus")}기록하기</button>`}
  document.getElementById("fabSlot").innerHTML=fab;
}
function scrGoals(){
  const ps=state.projects;const all=ps.map(pcalc);const B=all.reduce((s,c)=>s+c.budget,0),S=all.reduce((s,c)=>s+c.spent,0);
  const v=ui.gview;
  let body;

    :(p?.items||[]).map((x,i)=>({id:x.id,name:x.name,dot:PALETTE[i%PALETTE.length],on:x.id===s.item}));
  return `<div class="scrim" data-a="pk-close"><div class="sheet" role="dialog"><div class="shead"><h3>${s.picker==="goal"?"목표 선택":"세부 항목 선택"}</h3><button type="button" class="ibtn" data-a="pk-close" aria-label="닫기">${ic("x")}</button></div>
  <div>${opts.map(o=>`<button type="button" class="opt" data-a="pk" data-id="${o.id}">${o.icon?`<span class="circ" style="color:${o.col}">${ic(o.icon)}</span>`:`<span class="dot" style="background:${o.dot};margin:0 6px"></span>`}${esc(o.name)}${o.on?`<span class="chk">${ic("check")}</span>`:""}</button>`).join("")||'<div class="empty">이 목표에 세부 항목이 없어요</div>'}</div></div></div>`;
}
function autoGrow(t){if(!t)return;t.style.height="auto";t.style.height=Math.min(140,t.scrollHeight)+"px"}
function readTx(){const m=document.getElementById("t_memo");if(m)page.memo=m.value;const d=document.getElementById("t_date");if(d&&d.value)page.date=d.value}
function readProj(){const n=document.getElementById("pj_name");if(!n)return;page.name=n.value;page.date=document.getElementById("pj_date").value;
  page.items.forEach((it,i)=>{it.name=document.getElementById("pi_n_"+i).value;it.budget=moneyVal(document.getElementById("pi_b_"+i).value)})}
function removeTx(id){for(const p of state.projects){const i=p.tx.findIndex(t=>t.id===id);if(i>-1)p.tx.splice(i,1)}}
function commitTx(){
  readTx();const s=page;const amount=Number(s.amt)||0;if(!amount)return toast("금액을 입력해 주세요");
  const p=state.projects.find(x=>x.id===s.pid);if(!p)return toast("목표를 골라 주세요");if(!s.item)return toast("세부 항목을 골라 주세요");
  removeTx(s.id);p.tx.push({id:s.id,itemId:s.item,date:s.date,amount,memo:s.memo.trim()});persist();
  const msg=s.edit?"수정했어요":`${won(amount)}원 기록했어요`;page=null;drawPage();render();toast(msg);
}
function commitProj(){
  readProj();const s=page;const name=s.name.trim();if(!name)return toast("목표 이름을 입력해 주세요");
  const items=s.items.filter(i=>i.name.trim()||i.budget).map(i=>({id:i.id,name:i.name.trim()||"이름 없는 항목",budget:i.budget}));
  let p=state.projects.find(x=>x.id===s.id);
  if(p){Object.assign(p,{name,icon:s.icon,grad:s.grad,date:s.date,items});const ids=new Set(items.map(i=>i.id));p.tx.forEach(t=>{if(!ids.has(t.itemId)&&items[0])t.itemId=items[0].id})}
  else{p={id:s.id,name,icon:s.icon,grad:s.grad,date:s.date,items,tx:[]};state.projects.push(p)}
  persist();const isNew=s.isNew;hidePad();page=null;drawPage();ui.tab="goals";ui.proj=p.id;ui.pview="items";render();window.scrollTo({top:0});toast(isNew?"목표를 만들었어요":"저장했어요");
}

/* ---------- backup sheet ---------- */
function drawSheet(){
  const slot=document.getElementById("sheetSlot");const s=sheet;if(!s){slot.innerHTML="";return}
  let lb=null;try{lb=localStorage.getItem("hr_lastbackup")}catch(e){}
  slot.innerHTML=`<div class="scrim" data-a="s-close"><div class="sheet" role="dialog" aria-label="백업·설정"><div class="shead"><h3>백업 · 설정</h3><button type="button" class="ibtn" data-a="s-close" aria-label="닫기">${ic("x")}</button></div>
  <div style="font-size:14px;color:var(--ink2)">기록은 이 기기의 브라우저에만 저장돼요. 브라우저 데이터를 지우거나 기기를 바꾸면 사라지니 가끔 백업 파일을 저장해 두세요. 다른 기기에서는 백업 불러오기로 옮길 수 있어요.</div>
  <div style="display:flex;flex-direction:column;gap:8px"><button class="btn green wide" data-a="bk-export">백업 파일 저장하기</button><div class="aside" style="text-align:center">${lb?`마지막 백업 · ${fmtDate(lb)}`:"아직 백업한 적이 없어요"}</div></div>
  <label class="btn wide" style="text-align:center;cursor:pointer">백업 불러오기<input type="file" id="bk_file" accept=".json,application/json" hidden></label>
  ${s.confirm?`<div class="confirm" style="margin-top:0"><span>모든 목표와 기록을 지울까요?</span><span style="display:flex;gap:8px"><button class="btn" data-a="bk-resetno">취소</button><button class="btn green" data-a="bk-resetyes">모두 지우기</button></span></div>`:`<button class="btn" data-a="bk-reset" style="align-self:center;background:none;color:var(--bad)">모든 기록 지우기</button>`}
  </div></div>`;
}
function exportData(){
  const blob=new Blob([JSON.stringify({app:"haru-budget",version:2,exportedAt:new Date().toISOString(),state},null,1)],{type:"application/json"});const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=`하루예산_백업_${todayKey}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
  try{localStorage.setItem("hr_lastbackup",todayKey)}catch(e){}toast("백업 파일을 저장했어요");if(sheet)drawSheet();
}
function importData(file){const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const st=j.state||j;if(!st||!Array.isArray(st.projects))throw 0;
  state={categories:[],months:{},example:false,projects:[],projSeeded:true,...st};persist();sheet=null;drawSheet();ui.proj=null;render();toast("백업을 불러왔어요")}catch(e){toast("하루예산 백업 파일이 아니에요")}};r.readAsText(file)}
function toast(t){const s=document.getElementById("toastSlot");s.innerHTML=`<div class="toast">${esc(t)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>s.innerHTML="",1800)}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,d=el.dataset;
  if((a==="s-close"||a==="pk-close")&&el.classList.contains("scrim")&&e.target!==el)return;
  switch(a){
    case "tab":ui.tab=d.t;ui.proj=null;saveUi();render();window.scrollTo({top:0});break;
    case "gview":ui.gview=d.v;saveUi();render();break;
    case "pview":ui.pview=d.v;saveUi();render();break;
    case "open-proj":ui.tab="goals";ui.proj=d.id;ui.openItem=null;render();window.scrollTo({top:0});break;
    case "back":ui.proj=null;render();window.scrollTo({top:0});break;
    case "item":ui.openItem=ui.openItem===d.id?null:d.id;render();break;
    case "sel":ui.sel[d.ns]=ui.sel[d.ns]===d.id&&d.ns!=="s_m"?null:d.id;render();break;
    case "stat":ui.stat=d.v;saveUi();render();break;
    case "stat-goal":ui.statGoal=d.id;ui.sel={};render();break;
    case "sm-prev":ui.statMonth=shiftMonth(ui.statMonth,-1);ui.sel.s_d=null;render();break;
    case "sm-next":ui.statMonth=shiftMonth(ui.statMonth,1);ui.sel.s_d=null;render();break;
    case "clear-exp":state.projects=state.projects.filter(p=>!p.example);persist();ui.proj=null;render();toast("예시 목표를 지웠어요");break;
    case "add-tx":openTx({pid:d.pid,item:d.item});break;
    case "tx-edit":{const p=state.projects.find(x=>x.id===d.pid);const t=p&&p.tx.find(x=>x.id===d.id);if(t)openTx({edit:true,id:t.id,pid:p.id,item:t.itemId,amount:t.amount,memo:t.memo||"",date:t.date});break}
    case "new-proj":openProj(null);break;
    case "edit-proj":openProj(state.projects.find(x=>x.id===d.id));break;
    case "backup":sheet={confirm:false};drawSheet();break;
    case "bk-export":exportData();break;
    case "bk-reset":sheet.confirm=true;drawSheet();break;
    case "bk-resetno":sheet.confirm=false;drawSheet();break;
    case "bk-resetyes":state={categories:[],months:{},example:false,projects:[],projSeeded:true};persist();sheet=null;drawSheet();ui.proj=null;ui.tab="goals";render();toast("모두 지웠어요");break;
    case "s-close":sheet=null;drawSheet();break;
    /* record page */
    case "p-close":hidePad();page=null;drawPage();break;
    case "q":page.amt=d.v==="0"?"":String((Number(page.amt)||0)+Number(d.v));document.getElementById("amtBox").innerHTML=amtHTML();break;
    case "pick":readTx();page.picker=d.v;drawPage();break;
    case "pk-close":page.picker=null;drawPage();break;
    case "pk":if(page.picker==="goal"){if(page.pid!==d.id){page.pid=d.id;const p=state.projects.find(x=>x.id===d.id);page.item=p?.items[0]?.id||""}}else page.item=d.id;page.picker=null;drawPage();break;
    case "t-save":commitTx();break;
    case "t-del":readTx();page.confirm=true;drawPage();break;
    case "t-delno":page.confirm=false;drawPage();break;
    case "t-delyes":removeTx(page.id);persist();page=null;drawPage();render();toast("삭제했어요");break;
    /* project page */
    case "pj-icon":readProj();page.icon=d.v;drawPage();break;
    case "pj-grad":readProj();page.grad=d.v;drawPage();break;
    case "pj-add":readProj();page.items.push({id:"i_"+uid(),name:"",budget:0});drawPage();setTimeout(()=>document.getElementById("pi_n_"+(page.items.length-1))?.focus(),30);break;
    case "pj-rm":readProj();page.items.splice(Number(d.idx),1);drawPage();break;
    case "pj-del":readProj();page.confirm=true;drawPage();break;
    case "pj-delno":page.confirm=false;drawPage();break;
    case "pj-save":commitProj();break;
    case "pj-delyes":{const id=page.id;state.projects=state.projects.filter(p=>p.id!==id);persist();page=null;drawPage();ui.proj=null;render();toast("목표를 삭제했어요");break}
  }
});
/* inline keypad on record page */
document.addEventListener("click",e=>{const b=e.target.closest("#tpad [data-k]");if(!b||!page||page.kind!=="tx")return;const k=b.dataset.k;let cur=page.amt||"";
  if(k==="back")cur=cur.slice(0,-1);else if(k==="000"){if(!cur)return;cur+="000"}else cur=(cur==="0"?"":cur)+k;
  if(cur.length>13)return;page.amt=cur;document.getElementById("amtBox").innerHTML=amtHTML()});
document.addEventListener("pointerdown",e=>{if(e.target.closest("#tpad"))e.preventDefault()});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="t_memo"){autoGrow(t);return}
  if(t.hasAttribute&&t.hasAttribute("data-money")){const n=moneyVal(t.value);t.value=n?won(n):"";if(t.id.startsWith("pi_b_")&&page){readProj();const tot=document.getElementById("pj_total");if(tot)tot.textContent=won(page.items.reduce((a,i)=>a+Number(i.budget||0),0))+"원"}}});
document.addEventListener("change",e=>{const t=e.target;
  if(t.id==="bk_file"&&t.files&&t.files[0])importData(t.files[0]);
  if(t.id==="t_date"&&t.value){page.date=t.value;document.getElementById("dateV").textContent=md(t.value)}
  if(t.id==="pj_date"){const v=document.getElementById("pjDateV");v.textContent=t.value?fmtDate(t.value):"날짜 선택";v.parentElement.classList.toggle("empty",!t.value)}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if(page&&page.picker){page.picker=null;drawPage();return}if(sheet){sheet=null;drawSheet();return}if(page){hidePad();page=null;drawPage();return}}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches("svg [data-a]")){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});

/* ---------- budget keypad for goal editor ---------- */
const kpad=document.getElementById("kpad");document.getElementById("kpadKeys").innerHTML=padKeys();let kTarget=null,kHide=null;
function updPad(){if(!kTarget)return;const n=moneyVal(kTarget.value);document.getElementById("kpadVal").innerHTML=won(n)+"<small>원</small>";document.getElementById("kpadKor").textContent=korMoney(n)}
function showPad(t){clearTimeout(kHide);kTarget=t;kpad.hidden=false;document.body.classList.add("kb");
  const nm=document.getElementById("pi_n_"+t.id.slice(5));document.getElementById("kpadLabel").textContent=((nm&&nm.value.trim())||"항목")+" 예산";updPad();
  setTimeout(()=>{const sc=t.closest(".body");if(!sc)return;const r=t.getBoundingClientRect();const limit=window.innerHeight-kpad.offsetHeight-16;if(r.bottom>limit)sc.scrollBy({top:r.bottom-limit+8,behavior:"smooth"});else if(r.top<70)sc.scrollBy({top:r.top-90,behavior:"smooth"})},60)}
function hidePad(){kpad.hidden=true;document.body.classList.remove("kb");kTarget=null}
document.addEventListener("focusin",e=>{const t=e.target;if(t.hasAttribute&&t.hasAttribute("data-money"))showPad(t)});
document.addEventListener("focusout",e=>{if(e.target===kTarget){kHide=setTimeout(()=>{const a=document.activeElement;if(!(a&&a.hasAttribute&&a.hasAttribute("data-money")))hidePad()},150)}});
kpad.addEventListener("pointerdown",e=>e.preventDefault());
kpad.addEventListener("mousedown",e=>e.preventDefault());
kpad.addEventListener("click",e=>{const b=e.target.closest("[data-k]");if(!b||!kTarget)return;const k=b.dataset.k;const t=kTarget;
  if(k==="done"){t.blur();hidePad();return}
  let cur=String(t.value).replace(/[^\d]/g,"");
  if(k==="back")cur=cur.slice(0,-1);else if(k==="000"){if(!cur||cur==="0"){t.focus();return}cur+="000"}else cur=(cur==="0"?"":cur)+k;
  if(cur.length>13)return;t.value=cur?won(Number(cur)):"";t.dispatchEvent(new Event("input",{bubbles:true}));updPad();t.focus()});
init();
})();
</script>
</body>
</html>
